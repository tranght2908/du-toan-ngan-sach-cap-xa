<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý dự toán ngân sách tỉnh Vĩnh Long</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400;700&display=swap">
<style>
:root{
  --brand:#123B6D; --brand-ink:#FFFFFF; --brand-2:#1266B0; --brand-2-ink:#FFFFFF; --brand-soft:#E9F3FC;
  --red:#B12D30; --gold:#E6B94F;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#F5F8FC; --line:#D8E1EC; --line-2:#E8EDF4;
  --ink:#172B4D; --muted:#52627A; --faint:#7B8BA2;
  --ok:#16794A; --ok-bg:#E3F4EA; --warn:#9A5A06; --warn-bg:#FCF0DA; --bad:#B42318; --bad-bg:#FCE7E5;
  --info:#1D5FA8; --info-bg:#E4EEFA; --lock:#6A3FA0; --lock-bg:#EFE7F8; --draft:#566579; --draft-bg:#EBEFF4;
  --bar-giao:#1E6FD9; --bar-pb:#8DB8EC; --bar-chua:#DDE5EF;
  --shadow:0 1px 2px rgba(16,34,58,.04),0 10px 28px rgba(16,34,58,.07);
  --serif:"Noto Serif","Times New Roman",Georgia,serif;
  --sans:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; color-scheme:light;
}
/* Giao diện sáng cố định theo yêu cầu – không đổi sang nền tối theo hệ điều hành */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.num,td.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.stripe{height:5px;background:linear-gradient(90deg,var(--red) 0 69%,var(--gold) 69% 100%)}
.topbar{background:linear-gradient(115deg,#123B6D 0%,#174F85 60%,#1266B0 100%);color:var(--brand-ink);display:flex;align-items:center;gap:16px;padding-block:12px;padding-inline:24px;flex-wrap:wrap;box-shadow:0 3px 12px rgba(18,59,109,.15)}
.seal{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 3px var(--gold)}
.seal svg{width:22px;height:22px}
.agency{display:flex;flex-direction:column;min-width:0;flex:1 1 300px}
.agency small{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.agency b{font-size:18px;letter-spacing:.02em;text-transform:uppercase;line-height:1.25}
.agency span{font-size:14px;opacity:.85}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool{display:flex;flex-direction:column;gap:2px}
.tool label{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.tool select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:var(--brand-ink);border-radius:var(--r);padding:6px 8px;min-width:0;max-width:280px}
.tool select option{color:#13223A;background:#fff}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:var(--r);padding:7px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtn.on{background:var(--gold);color:#1B1B1B;border-color:var(--gold);font-weight:600}
.demo-tag{font-size:13px;background:var(--gold);color:#241a00;border-radius:3px;padding:2px 6px;font-weight:600;letter-spacing:.04em;align-self:flex-start;margin-top:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 70px)}
.shell.demo{grid-template-columns:260px minmax(0,1fr) 400px}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-inline:12px;display:flex;flex-direction:column;gap:16px}
.who{padding:10px 10px 12px;border-bottom:1px solid var(--line-2)}
.who b{display:block;font-size:15.5px}
.who span{font-size:14px;color:var(--muted)}
.who .rolechip{display:inline-block;margin-top:6px;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.navg h4{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 10px 6px;font-weight:600}
.navg a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--r);color:var(--ink);text-decoration:none;cursor:pointer}
.navg a:hover{background:var(--surface-2)}
.navg a.on{background:linear-gradient(90deg,var(--brand-soft),#F7FBFF);color:var(--brand-2);font-weight:700;box-shadow:inset 3px 0 0 var(--brand-2)}
.cnt{font-size:13px;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--red);color:#fff;font-weight:600}
main{padding-block:24px 48px;padding-inline:28px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin-bottom:4px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:25px;margin:0;line-height:1.3;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 16px rgba(16,34,58,.035)}
.kpi small{display:block;font-size:13.5px;color:var(--muted)}
.kpi b{display:block;font-size:23px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi span{font-size:13.5px;color:var(--faint)}
.kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:0 4px 16px rgba(16,34,58,.035)}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel>header h3{margin:0;font-size:16.5px}
.panel>header p{margin:0;font-size:14px;color:var(--muted)}
.pb{padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- buttons & form ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.btn.pri{background:linear-gradient(135deg,var(--brand-2),#0F5799);border-color:var(--brand-2);color:var(--brand-2-ink);box-shadow:0 4px 10px rgba(18,102,176,.18)}
.btn.pri:hover{filter:brightness(1.06);color:var(--brand-2-ink);transform:translateY(-1px)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 9px;font-size:14.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:14px;color:var(--muted);font-weight:500}
.fld label i{color:var(--bad);font-style:normal}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:62px}
.inp:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.inp[readonly],.inp:disabled{background:var(--surface-2);color:var(--muted)}
.inp.money{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--brand-2)}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;background:var(--surface-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t td.num,.t th.num{text-align:right;white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.t td .sub{display:block;font-size:13.5px;color:var(--muted)}
.t .inp{padding:5px 7px}
.diff-up{color:var(--ok)} .diff-down{color:var(--bad)}

/* ---------- chips / status ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--draft-bg);color:var(--draft)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.info{background:var(--info-bg);color:var(--info)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.lock{background:var(--lock-bg);color:var(--lock)}
.tag{font-size:13px;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.tc{border-color:var(--info);color:var(--info)}
.callout{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:0 var(--r) var(--r) 0}
.callout.info{border-color:var(--info);background:var(--info-bg)}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)}
.callout.ok{border-color:var(--ok);background:var(--ok-bg)}
.callout.lock{border-color:var(--lock);background:var(--lock-bg)}
.callout b{display:block;margin-bottom:2px}
.callout p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- stepper ---------- */
.stepper{display:grid;grid-template-columns:repeat(10,minmax(60px,1fr));gap:0;overflow-x:auto;padding-bottom:4px}
.st{position:relative;padding:0 4px;text-align:center;font-size:13.5px;color:var(--faint)}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st i{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-style:normal;font-weight:700;font-size:14px}
.st.done{color:var(--ink)} .st.done i{background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand-2)}
.st.done::before{background:var(--brand-2)}
.st.cur{color:var(--ink);font-weight:600} .st.cur i{background:var(--brand-2);border-color:var(--brand-2);color:var(--brand-2-ink);box-shadow:0 0 0 4px var(--brand-soft)}
.st.cur::before{background:var(--brand-2)}
.st.ret i{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 0 0 4px var(--warn-bg)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding-inline:8px}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--brand-2);border-bottom-color:var(--brand-2)}

/* ---------- bars ---------- */
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--bar-chua);min-width:120px}
.bar span{display:block;height:100%}
.bar .g{background:var(--bar-giao)} .bar .p{background:var(--bar-pb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line-2);margin-left:6px}
.tl li:last-child{border-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-2)}
.tl li.w::before{border-color:var(--warn)} .tl li.o::before{border-color:var(--ok)}
.tl .when{font-size:13.5px;color:var(--faint)}
.tl .what{font-weight:600}
.tl .note{font-size:14.5px;color:var(--muted);margin-top:2px}

/* ---------- demo drawer ---------- */
aside.demo{background:var(--surface);border-left:1px solid var(--line);padding-block:14px;padding-inline:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
aside.demo h2{font-size:17px;margin:0}
.scgrp h5{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:10px 0 6px}
.sc{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px;border-radius:var(--r);border:1px solid transparent;cursor:pointer}
.sc:hover{background:var(--surface-2)}
.sc.cur{border-color:var(--brand-2);background:var(--brand-soft)}
.sc .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.sc.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.sc .t1{font-weight:600;font-size:15px;line-height:1.35}
.sc .t2{font-size:13.5px;color:var(--muted)}
.sc .t3{font-size:14.5px;margin-top:6px;color:var(--ink)}
.mini-flow{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:6px;overflow:auto}

/* ---------- hành trình dữ liệu & ngân sách ---------- */
.trail{gap:18px}
.trail h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;font-weight:600}
.mrows{display:flex;flex-direction:column;gap:9px}
.mrow{display:grid;grid-template-columns:120px auto minmax(60px,1fr);gap:3px 10px;align-items:center;font-size:15px}
.mrow .mt{color:var(--muted)}
.mrow b{text-align:right;min-width:52px}
.mbar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--brand)}
.mrow small{grid-column:1/-1;color:var(--faint);font-size:13.5px}
.tl.compact li{padding-bottom:10px}
.tl li.cur::before{background:var(--brand-2);border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.hsline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.hsline:hover{border-color:var(--brand-2)}
.hsline > span:first-child{display:flex;flex-direction:column;line-height:1.3}
.hsline small{color:var(--muted);font-size:14px}

/* ---------- luồng dữ liệu theo vai trò ---------- */
.flowhero{position:relative;overflow:hidden;border:0;background:linear-gradient(125deg,#123B6D,#185B96 62%,#1A76BA);color:#fff;padding:24px 26px;box-shadow:0 12px 28px rgba(18,59,109,.18)}
.flowhero::after{content:"";position:absolute;width:310px;height:310px;border-radius:50%;right:-105px;top:-170px;border:46px solid rgba(255,255,255,.09)}
.flowhero .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#DCEEFF}
.flowhero .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(230,185,79,.18)}
.flowhero h2{position:relative;margin:7px 0 5px;font-size:28px;line-height:1.2;letter-spacing:-.02em}
.flowhero p{position:relative;max-width:760px;margin:0;color:#E5F2FF}
.flowstats{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.flowstat{min-width:130px;padding:9px 12px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(9,35,67,.18);backdrop-filter:blur(4px)}
.flowstat b{display:block;font-size:20px;line-height:1.15}.flowstat span{font-size:12.5px;color:#DCEEFF}
.flowguide{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#FFF9EA;border:1px solid #F0DFA7;border-radius:8px;color:#70551A;font-size:14.5px}
.flowguide strong{color:#5C4310}.flowguide i{font-style:normal;font-size:18px;line-height:1}
.flowmap-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.flowmap-head h3{margin:0;font-size:17px}.flowmap-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.flow-key{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.flow-key span{display:inline-flex;gap:5px;align-items:center}.flow-key i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.rchain{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.rcard{flex:1 0 142px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--surface);cursor:pointer;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(16,34,58,.08)}
.rcard:hover{border-color:var(--brand-2)}
.rcard.on{border-color:var(--brand-2);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-2)}
.rcard .rs{font-size:13px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.rcard b{font-size:15.5px;line-height:1.3}
.rcard .rn{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.rcard .rm{font-size:14px;color:var(--muted)}
.rarrow{display:grid;place-items:center;width:24px;flex:none;color:var(--faint);font-size:18px}
.io{display:grid;grid-template-columns:1fr 1.1fr 1fr}
.io > div{padding:14px 16px;min-width:0}
.io .mid{background:linear-gradient(180deg,#F1F7FD,#F8FBFE);border-inline:1px solid var(--line-2)}
.io h5,.lbl5{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;font-weight:600}
.io ul{margin:6px 0 0;padding-left:18px}
.io li{margin-bottom:3px}
.ioitem{padding:8px 0;border-bottom:1px dashed var(--line-2)}
.ioitem:last-child{border-bottom:0}
.iorole{border:1px solid var(--brand-2);color:var(--brand-2);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:14.5px;font-weight:600;cursor:pointer}
.iorole:hover{background:var(--brand-soft)}
.iorole.static{border-color:var(--line);color:var(--muted);cursor:default;background:var(--surface-2)}
.ioitem.ret .iorole{border-color:var(--warn);color:var(--warn)}
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.journey-title{display:flex;gap:10px;align-items:center}.journey-title .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px var(--ok-bg)}
.t tr.selrow td{background:var(--brand-soft)}
details.panel > summary{list-style:none}
@media (max-width:900px){.io,.jgrid{grid-template-columns:minmax(0,1fr)}.io .mid{border-inline:0;border-block:1px solid var(--line-2)}}

/* ---------- menu người dùng ---------- */
.umenu{position:relative}
.ubtn{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:var(--r);padding:5px 10px 5px 6px;cursor:pointer;text-align:left}
.ubtn:hover{background:rgba(255,255,255,.22)}
.av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}

.usep{height:1px;background:var(--line-2);margin:6px 0}

.flow{width:100%;height:auto;display:block;min-width:900px}
.flow .lanebg{fill:var(--surface)} .flow .lanehd{stroke:var(--line)} .flow .lanebd{fill:none;stroke:var(--line)}
.flow text{font-family:var(--sans);fill:var(--ink)}
.flow .node rect,.flow .node polygon{fill:var(--surface);stroke:var(--faint);stroke-width:1.3}
.flow .node.ret rect{fill:var(--surface-2);stroke:var(--info)}
.flow .node.vis rect,.flow .node.vis polygon{fill:var(--brand-soft);stroke:var(--brand-2)}
.flow .node.cur rect,.flow .node.cur polygon{fill:var(--brand-2);stroke:var(--brand-2)}
.flow .node.cur text{fill:var(--brand-2-ink);font-weight:700}
.flow .node.curw rect{fill:var(--warn);stroke:var(--warn)} .flow .node.curw text{fill:#fff;font-weight:700}
.flow .edge{fill:none;stroke:var(--faint);stroke-width:1.3}
.flow .edge.vis{stroke:var(--brand-2);stroke-width:2.6}
.flow .dot{fill:var(--ink)}
.flow .lbl{font-size:15px;fill:var(--muted)}
@keyframes pulse{0%{stroke-opacity:.9;stroke-width:3}100%{stroke-opacity:0;stroke-width:14}}
.flow .halo{fill:none;stroke:var(--brand-2);animation:pulse 1.6s ease-out infinite}

.ov{position:fixed;inset:0;background:rgba(10,20,35,.45);display:grid;place-items:center;z-index:50;padding:16px}

/* Giao dự toán: ghi văn bản, cộng/trừ vào khoản giao, lưu lịch sử điều chỉnh */
function applyGiao(S, vb, t, silent) {
  const h = S.hoSo.find(x => x.id === vb.hoSoId);
  const rec = {id: uid('V'), nam: vb.nam, so: vb.so, ngay: vb.ngay, ngayGiao: vb.ngayGiao, dv: vb.dv, loaiVB: vb.loaiVB, soQDTuChu: vb.soQDTuChu,
    hoSoId: vb.hoSoId, t, nguoi: ROLES.phanbo.nguoi, kySo: vb.kySo || null, rows: []};
  vb.rows.forEach(r => {
    if (!r.so) return;
    const p = S.phanBo.find(x => x.id === r.pbId);
    const l = h.lines.find(x => x.id === p.lineId);
    let k = l.khoanId ? S.khoan.find(x => x.id === l.khoanId)
      : S.khoan.find(x => x.nam === vb.nam && x.dv === p.dv && x.nv === l.nv && x.nguon === l.nguon && x.loai === l.loai);
    if (!k) {
      k = {id: uid('K'), nam: vb.nam, dv: p.dv, nv: l.nv, lv: l.lv, nguon: l.nguon, loai: l.loai, so: 0, st: h.loai === 'DC' ? 'Đã giao bổ sung' : 'Đã giao', vb: [], lichSu: [], ngayGiao: vb.ngayGiao};
      S.khoan.push(k);
      if (h.loai === 'DC' && !l.khoanId) l.khoanNew = k.id;
    } else if (h.loai === 'DC') {
      k.lichSu.push({ngay: vb.ngayGiao, truoc: k.so, sau: k.so + r.so, delta: r.so, lyDo: l.canCu, vb: vb.so, hoSo: h.ma});
      k.st = 'Đã điều chỉnh';
    }
    k.so += r.so;
    k.vb.push(rec.id);
    p.daGiao += r.so;
    rec.rows.push({pbId: p.id, khoanId: k.id, so: r.so, nv: l.nv, nguon: l.nguon, loai: l.loai});
  });
  S.vbGiao.push(rec);
  if (last(h.path) !== 'n10') h.path.push('n10');
  if (!silent) S.log.push({t, role: 'phanbo', hs: h.id, buoc: 9, act: 'Giao dự toán – ' + vb.so, note: nm('donVi', vb.dv) + ': ' + fmt(sum(rec.rows, r => r.so)) + ' đồng'});
  return rec;
}

/* ---------- truy vấn ---------- */
const nodeOf = h => last(h.path);
const stOf = h => NODE[nodeOf(h)];
const isApproved = h => !!h.duyetAt;
const isEditable = h => ['n2', 'r1', 'r2', 'r3'].includes(nodeOf(h));
const hsTot = (h, k) => sum(h.lines, l => l[k] || 0);
const pbOfLine = (S, l) => S.phanBo.filter(p => p.lineId === l.id);
const pbSumLine = (S, l, onlyChot) => sum(pbOfLine(S, l).filter(p => !onlyChot || p.chot), p => p.so);

function khoanSt(S, k) {
  const pending = S.hoSo.some(h => h.loai === 'DC' && h.nam === k.nam && nodeOf(h) !== 'n10' && h.lines.some(l => l.khoanId === k.id));
  return pending ? 'Đang điều chỉnh' : k.st;
}
const KST = {'Đã giao': 'ok', 'Đang điều chỉnh': 'warn', 'Đã điều chỉnh': 'info', 'Đã giao bổ sung': 'lock'};

function yearAgg(S, nam) {
  const hs = S.hoSo.filter(h => h.nam === nam && isApproved(h));
  const lines = hs.flatMap(h => h.lines.map(l => ({...l, h})));
  const pb = S.phanBo.filter(p => p.nam === nam && p.chot);
  const lineById = Object.fromEntries(lines.map(l => [l.id, l]));
  const khoan = S.khoan.filter(k => k.nam === nam);
  const a = {duyet: sum(lines, l => l.duyet || 0), pb: sum(pb, p => p.so), giao: sum(khoan, k => k.so)};
  a.chuaPB = a.duyet - a.pb; a.pbChuaGiao = sum(pb, p => p.so - p.daGiao);
  a.byNguon = DM.nguon.map(n => {
    const d = sum(lines.filter(l => l.nguon === n.ma), l => l.duyet || 0);
    const p = sum(pb.filter(x => lineById[x.lineId] && lineById[x.lineId].nguon === n.ma), x => x.so);
    const g = sum(khoan.filter(k => k.nguon === n.ma), k => k.so);
    return {ma: n.ma, ten: n.ten, duyet: d, pb: p, giao: g};
  });
  a.byDv = DM.donVi.map(d => ({ma: d.ma, ten: d.ten, cdt: d.cdt, giao: sum(khoan.filter(k => k.dv === d.ma), k => k.so), n: khoan.filter(k => k.dv === d.ma).length,
    pbChuaGiao: sum(pb.filter(p => p.dv === d.ma), p => p.so - p.daGiao)})).filter(x => x.giao || x.pbChuaGiao);
  a.lines = lines; a.pbRows = pb; a.khoan = khoan;
  return a;
}

function canXuLy(S, nam) {
  const out = [];
  S.hoSo.filter(h => h.nam === nam && isApproved(h)).forEach(h => h.lines.forEach(l => {
    const rest = (l.duyet || 0) - pbSumLine(S, l, true);
    if (Math.abs(rest) > 0) out.push({loai: 'Đã duyệt, chưa phân bổ', c: 'warn', so: rest, nv: l.nv, nguon: l.nguon, hs: h, go: {view: 'phanbo', hs: h.id}, role: 'phanbo'});
  }));
  S.phanBo.filter(p => p.nam === nam && p.chot && p.so - p.daGiao !== 0).forEach(p => {
    const h = S.hoSo.find(x => x.id === p.hoSoId), l = h.lines.find(x => x.id === p.lineId);
    out.push({loai: 'Đã phân bổ, chưa giao', c: 'info', so: p.so - p.daGiao, nv: l.nv, nguon: l.nguon, dv: p.dv, hs: h, go: {view: 'giao', dv: p.dv, hs: h.id}, role: 'phanbo'});
  });
  S.hoSo.filter(h => h.nam === nam && h.loai === 'DC' && !isApproved(h)).forEach(h => {
    out.push({loai: 'Hồ sơ điều chỉnh đang chờ duyệt', c: 'lock', so: hsTot(h, 'deNghi'), hs: h, nv: null, go: {view: 'hs', id: h.id}, role: stOf(h).role, buoc: stOf(h).ten});
  });
  return out;
}

  return pageHead('Tổng quan', `Xin chào, ${esc(r.nguoi)}`, `${esc(r.ten)} · ${esc(r.cv)}. Vai trò này phụ trách <b>bước ${ROLE_STEPS[U.role].join(' và ')}</b> trong luồng 10 bước.`,
    `<button class="btn" ${go('flow')}>Xem luồng dữ liệu</button>`)
  + `<h3 style="margin:0 0 8px;font-size:16px">Số liệu năm ngân sách ${U.nam}</h3>` + kpiRow(a)
  + `<div class="grid g2">
    <section class="panel"><header><h3>Việc cần xử lý của tôi</h3><p>${q.length} hồ sơ</p></header>${queueTable(q, 'Không có hồ sơ nào đang chờ vai trò này.')}</section>
    <section class="panel"><header><h3>Hoạt động gần đây</h3></header><div class="pb"><ul class="tl">${recent.map(l => { const h = S.hoSo.find(x => x.id === l.hs); return `<li class="${/Trả|Yêu cầu/.test(l.act) ? 'w' : /Thông qua|Giao|Tiếp nhận/.test(l.act) ? 'o' : ''}"><div class="when">${dtt(l.t)} · Bước ${l.buoc} · ${esc(ROLES[l.role].nguoi)}</div><div class="what">${esc(l.act)}${h ? ` – <a href="#" ${go('hs', {id: h.id})}>${esc(h.ma)}</a>` : ''}</div>${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</li>`; }).join('') || '<li>Chưa có hoạt động.</li>'}</ul></div></section>
  </div>`;
}

function vViec() {

}

function vList() {
  const list = S.hoSo.filter(h => h.nam === U.nam);
  const ky = kyOf(U.nam);
  const hasDT = list.some(h => h.loai === 'DT');
  const canDT = U.role === 'lap' && ky && ky.st === 'Đang mở tiếp nhận' && !hasDT;

    <button class="btn" data-act="createDC" ${canDC ? '' : 'disabled'} title="${canDC ? '' : 'Chỉ lập khi năm này đã có dự toán được giao'}">+ Lập hồ sơ điều chỉnh/bổ sung</button>`;

  return pageHead('Hồ sơ', `Hồ sơ năm ngân sách ${U.nam}`, 'Mỗi năm có một hồ sơ dự toán chung do Bộ phận Tài chính – Kế toán lập. Điều chỉnh/bổ sung trong năm lập thành hồ sơ riêng và đi lại từ Bước 3.', right)
    + note + `<section class="panel"><div class="tw"><table class="t"><thead><tr><th>Mã hồ sơ</th><th>Tên hồ sơ</th><th>Loại</th><th>Trạng thái</th><th>Đang ở bước</th><th class="num">Đề nghị (đ)</th><th class="num">Được duyệt (đ)</th></tr></thead><tbody>
    ${list.map(h => `<tr class="click" ${go('hs', {id: h.id})}><td><b>${esc(h.ma)}</b><span class="sub">Phiên bản ${h.phienBan}</span></td><td>${esc(h.ten)}</td><td>${h.loai === 'DT' ? '<span class="tag">Dự toán năm</span>' : '<span class="tag tc">Điều chỉnh/bổ sung</span>'}</td><td>${stChip(h)}</td><td>${stOf(h).buoc}. ${esc(stOf(h).ten)}<span class="sub">${esc(ROLES[stOf(h).role]?.ten || '')}</span></td><td class="num">${fmtS(hsTot(h, 'deNghi')).replace(/^\+/, '')}</td><td class="num">${isApproved(h) ? fmt(hsTot(h, 'duyet')) : '—'}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">Chưa có hồ sơ năm ${U.nam}.</td></tr>`}
    </tbody></table></div></section>`;
}

/* ---------- chi tiết hồ sơ ---------- */
function stepper(h) {
  const n = stOf(h), cur = n.buoc;
  return `<div class="stepper">${STEPS.map((s, i) => { const b = i + 1; const cls = b < cur ? 'done' : b === cur ? (n.ret ? 'cur ret' : 'cur') : ''; return `<div class="st ${cls}"><i>${b}</i>${s}</div>`; }).join('')}</div>`;
}
function lineMode(h) {
  const nd = nodeOf(h);
  if (U.role === 'lap' && isEditable(h)) return 'lap';
  if (U.role === 'thamtra' && nd === 'n5') return 'tt';
  if (U.role === 'thamquyen' && nd === 'n7') return 'qd';
  return 'ro';
}
const reached = (h, nodes) => h.path.some(p => nodes.includes(p));

function canDoi(h, field) {
  return DM.nguon.map(n => {
    const nguon = sum(h.nguonDK.filter(g => g.nguon === n.ma), g => g.so || 0);
    const chi = sum(h.lines.filter(l => l.nguon === n.ma), l => (l[field] ?? l.deNghi) || 0);
    return {ma: n.ma, ten: n.ten, nguon, chi, cl: nguon - chi};
  }).filter(x => x.nguon || x.chi);
}

function linesTable(h) {
  const m = lineMode(h), showTT = m === 'tt' || reached(h, ['n5']) && h.lines.some(l => l.thamTra !== null), showQD = m === 'qd' || isApproved(h);

  if (h.loai === 'DC') return linesTableDC(h, m, showTT, showQD);
  const rows = h.lines.map((l, i) => `<tr>
    <td class="muted">${i + 1}</td>
    <td style="min-width:220px">${E ? sel('l-nv-' + l.id, 'l:' + l.id + ':nv', DM.nhiemVu, l.nv) : `<b>${esc(nm('nhiemVu', l.nv))}</b>`}<span class="sub">${esc(nm('linhVuc', l.lv))}</span></td>
    <td style="min-width:150px">${E ? sel('l-ng-' + l.id, 'l:' + l.id + ':nguon', DM.nguon, l.nguon) : esc(nm('nguon', l.nguon))}</td>

    <td class="num" style="min-width:140px">${E ? money('l-dn-' + l.id, 'l:' + l.id + ':deNghi', l.deNghi) : fmt(l.deNghi)}</td>
    ${dmCell(h, l)}
    <td style="min-width:220px">${E ? area('l-cc-' + l.id, 'l:' + l.id + ':canCu', l.canCu, false, 'Căn cứ, định mức áp dụng') : `<span class="small">${esc(l.canCu)}</span>`}</td>
    ${showTT ? `<td class="num" style="min-width:140px">${m === 'tt' ? money('l-tt-' + l.id, 'l:' + l.id + ':thamTra', l.thamTra) : (l.thamTra === null ? '—' : fmt(l.thamTra))}${l.thamTra !== null && l.thamTra !== l.deNghi ? `<span class="sub ${l.thamTra < l.deNghi ? 'diff-down' : 'diff-up'}">${fmtS(l.thamTra - l.deNghi)}</span>` : ''}</td>
      <td style="min-width:180px">${m === 'tt' ? area('l-yk-' + l.id, 'l:' + l.id + ':ykTT', l.ykTT, false, 'Ý kiến thẩm tra') : `<span class="small">${esc(l.ykTT || '')}</span>`}</td>` : ''}
    ${showQD ? `<td class="num" style="min-width:140px">${m === 'qd' ? money('l-du-' + l.id, 'l:' + l.id + ':duyet', l.duyet ?? l.thamTra) : (l.duyet === null ? '—' : `<b>${fmt(l.duyet)}</b>`)}</td>` : ''}

  </tr>`).join('');
  return `<div class="tw"><table class="t"><thead><tr><th>#</th><th>Nhiệm vụ chi</th><th>Nguồn</th><th>Loại kinh phí</th><th class="num">Số đề nghị (đ)</th><th class="num">Theo định mức (đ)</th><th>Căn cứ lập dự toán</th>
    ${showTT ? '<th class="num">Sau thẩm tra (đ)</th><th>Ý kiến thẩm tra</th>' : ''}${showQD ? '<th class="num">Được duyệt (đ)</th>' : ''}${E ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows || `<tr><td colspan="9" class="empty">Chưa có dòng dự toán.</td></tr>`}</tbody>
    <tfoot><tr><td></td><td colspan="3">Tổng cộng (${h.lines.length} nhiệm vụ)</td><td class="num">${fmt(hsTot(h, 'deNghi'))}</td><td></td><td></td>${showTT ? `<td class="num">${fmt(hsTot(h, 'thamTra'))}</td><td></td>` : ''}${showQD ? `<td class="num">${fmt(sum(h.lines, l => (l.duyet ?? l.thamTra) || 0))}</td>` : ''}${E ? '<td></td>' : ''}</tr></tfoot>
  </table></div>
  ${E ? `<div class="pb row"><button class="btn" data-act="addLine">+ Thêm nhiệm vụ chi</button><button class="btn" data-act="excelAsk">Nhập từ Excel</button>${!h.lines.length ? '<button class="btn" data-act="fillSample">Điền nhanh dữ liệu minh họa</button>' : ''}</div>` : ''}`;
}

      <td style="min-width:150px">${l.kieu === 'bs' && E ? sel('l-ng-' + l.id, 'l:' + l.id + ':nguon', DM.nguon, l.nguon) + `<div style="margin-top:4px">${sel('l-lo-' + l.id, 'l:' + l.id + ':loai', DM.loaiKP, l.loai)}</div>` : `${esc(nm('nguon', l.nguon))}<span class="sub">${esc(nm('loaiKP', l.loai))}</span>`}</td>

      <td class="num">${fmt(soSau)}</td>
      <td style="min-width:200px">${E ? area('l-cc-' + l.id, 'l:' + l.id + ':canCu', l.canCu, false, 'Lý do, văn bản liên quan') : `<span class="small">${esc(l.canCu)}</span>`}</td>

    <tfoot><tr><td></td><td colspan="4">Tổng tăng/giảm</td><td class="num">${fmtS(hsTot(h, 'deNghi'))}</td><td colspan="2"></td>${showTT ? `<td class="num">${fmtS(hsTot(h, 'thamTra'))}</td><td></td>` : ''}${showQD ? `<td class="num">${fmtS(sum(h.lines, l => (l.duyet ?? l.thamTra) || 0))}</td>` : ''}${E ? '<td></td>' : ''}</tr></tfoot></table></div>
  ${E ? `<div class="pb row"><button class="btn" data-act="addDC">+ Điều chỉnh khoản đã giao</button><button class="btn" data-act="addBS">+ Bổ sung nhiệm vụ mới</button></div>` : ''}`;

    <p class="muted small">Nguồn và văn bản căn cứ của từng khoản điều chỉnh/bổ sung ghi ở cột “Lý do, căn cứ” trong tab Chi tiết. Tài liệu kèm theo ở tab Tài liệu.</p></div>`;
  const cd = canDoi(h, lineMode(h) === 'tt' || reached(h, ['n6']) ? 'thamTra' : 'deNghi');

    : E ? `<div class="callout"><b>Chưa ghi nhận số giao từ cấp trên năm ${h.nam}</b><p class="small">Ghi nhận ở mục <a href="#" ${go('capTren')}>Số giao từ cấp trên</a> để điền sẵn nguồn dự kiến.</p></div>` : '';

    ${h.nguonDK.map(g => `<tr><td style="min-width:170px">${E ? sel('g-n-' + g.id, 'g:' + g.id + ':nguon', DM.nguon, g.nguon) : esc(nm('nguon', g.nguon))}</td><td class="num" style="min-width:150px">${E ? money('g-s-' + g.id, 'g:' + g.id + ':so', g.so) : fmt(g.so)}</td><td style="min-width:260px">${E ? txt('g-v-' + g.id, 'g:' + g.id + ':vb', g.vb, false, 'Số, ngày, trích yếu văn bản') : esc(g.vb)}</td>${E ? `<td><button class="btn sm ghost danger" data-act="delNguon" data-id="${g.id}">Xóa</button></td>` : ''}</tr>`).join('') || '<tr><td colspan="4" class="empty">Chưa khai báo nguồn.</td></tr>'}
    </tbody><tfoot><tr><td>Tổng nguồn</td><td class="num">${fmt(sum(h.nguonDK, g => g.so || 0))}</td><td></td>${E ? '<td></td>' : ''}</tr></tfoot></table></div>
    ${E ? '<div class="row" style="margin-top:8px"><button class="btn" data-act="addNguon">+ Thêm nguồn</button></div>' : ''}</div>
    <div><h4 style="margin:0 0 6px">Cân đối nguồn – nhiệm vụ chi</h4>
    <div class="tw"><table class="t"><thead><tr><th>Nguồn</th><th class="num">Nguồn dự kiến</th><th class="num">Tổng chi bố trí</th><th class="num">Chênh lệch</th><th>Đánh giá</th></tr></thead><tbody>
    ${cd.map(x => `<tr><td>${esc(x.ten)}</td><td class="num">${fmt(x.nguon)}</td><td class="num">${fmt(x.chi)}</td><td class="num ${x.cl < 0 ? 'diff-down' : ''}">${fmtS(x.cl)}</td><td>${x.cl < 0 ? chip('Vượt nguồn', 'bad') : chip('Cân đối', 'ok')}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="fld"><label for="h-cc">Căn cứ chung lập dự toán</label>${area('h-cc', 'h:canCuChung', h.canCuChung, !E)}</div>
  </div>`;
}

      <div><button class="btn" data-act="addTL">Đính kèm</button></div></div>` : ''}
  </div>`;
}

/* Tab Phiên bản: mỗi phiên bản là một bản lưu đã khóa (số liệu, tài liệu, kết quả xử lý) để lãnh đạo đối chiếu */
function pbTab(h) {
  const vs = h.versions, draft = isEditable(h) && !vs.some(v => v.v === h.phienBan);
  if (!vs.length) return `<div class="empty">Phiên bản 1 đang soạn thảo – chưa gửi lần nào.</div>`;
  const i = Math.min(U.p.cmp ?? vs.length - 1, vs.length - 1), cur = vs[i], prev = vs[i - 1];
  const stc = st => /trả lại/i.test(st) ? 'warn' : /duyệt/i.test(st) ? 'ok' : 'info';
  const list = `<p class="small muted" style="margin:0">Bấm vào một phiên bản để xem số liệu, tài liệu và kết quả xử lý của phiên bản đó.</p>
    <div class="tw"><table class="t"><thead><tr><th>Phiên bản</th><th>Gửi lúc · người gửi</th><th>Kết quả xử lý</th><th class="num">Tài liệu</th><th class="num">Tổng đề nghị (đ)</th></tr></thead><tbody>
    ${vs.map((v, j) => `<tr class="click ${j === i ? 'selrow' : ''}" data-act="cmp" data-i="${j}" title="Bấm để xem phiên bản v${v.v}"><td><b>v${v.v}</b>${v.v > 1 ? `<span class="sub">sinh từ v${v.v - 1}</span>` : ''}</td><td class="small">${dtt(v.t)}<span class="sub">${esc(v.nguoi)}</span>${v.kySo ? sigBadge(v.kySo) : ''}</td>
      <td>${chip(v.st || 'Đã gửi', stc(v.st || ''))}${v.ketQua ? `<span class="sub">${esc(ROLES[v.ketQua.role].ten)} · ${dtt(v.ketQua.t)}</span>` : ''}</td><td class="num">${v.taiLieu.length}</td><td class="num">${fmtS(sum(v.lines, l => l.deNghi)).replace(/^\+/, '')}</td></tr>`).join('')}
    ${draft ? `<tr><td><b>v${h.phienBan}</b><span class="sub">sinh từ v${h.phienBan - 1}</span></td><td class="small muted">Chưa gửi</td><td>${chip('Đang chỉnh sửa', '')}</td><td class="num">${h.taiLieu.length}</td><td class="num">${fmtS(hsTot(h, 'deNghi')).replace(/^\+/, '')}</td></tr>` : ''}
    </tbody></table></div>`;
  const kq = cur.ketQua ? `<div class="callout"><b>Kết quả xử lý: bị trả lại ở Bước ${cur.ketQua.buoc} – ${esc(ROLES[cur.ketQua.role].ten)} (${dtt(cur.ketQua.t)})</b><p>${esc(cur.ketQua.note)}</p></div>` : '';
  const has = k => cur.lines.some(l => l[k] !== null && l[k] !== undefined);
  const showTT = has('thamTra'), showQD = has('duyet');
  const lines = `<div class="tw"><table class="t"><thead><tr><th>Nhiệm vụ</th><th>Nguồn · loại KP</th><th class="num">Đề nghị (đ)</th>${showTT ? '<th class="num">Sau thẩm tra</th><th>Ý kiến thẩm tra</th>' : ''}${showQD ? '<th class="num">Được duyệt</th>' : ''}</tr></thead><tbody>
    ${cur.lines.map(l => `<tr><td>${esc(nm('nhiemVu', l.nv))}${l.dv ? `<span class="sub">${esc(nm('donVi', l.dv))}</span>` : ''}</td><td>${esc(nm('nguon', l.nguon))}<span class="sub">${esc(nm('loaiKP', l.loai))}</span></td><td class="num">${fmt(l.deNghi)}</td>${showTT ? `<td class="num">${l.thamTra === null ? '—' : fmt(l.thamTra)}</td><td class="small">${esc(l.ykTT || '')}</td>` : ''}${showQD ? `<td class="num">${l.duyet === null ? '—' : fmt(l.duyet)}</td>` : ''}</tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2">Tổng (${cur.lines.length} dòng)</td><td class="num">${fmt(sum(cur.lines, l => l.deNghi))}</td>${showTT ? `<td class="num">${fmt(sum(cur.lines, l => l.thamTra || 0))}</td><td></td>` : ''}${showQD ? `<td class="num">${fmt(sum(cur.lines, l => l.duyet || 0))}</td>` : ''}</tr></tfoot></table></div>`;
  const docs = `<div class="tw"><table class="t"><thead><tr><th>Tài liệu lưu kèm v${cur.v}</th><th>Loại</th><th>Ngày</th></tr></thead><tbody>${cur.taiLieu.map(t => `<tr><td>📄 ${esc(t.ten)}</td><td>${esc(nm('bieuMau', t.bm))}</td><td>${dt(t.ngay)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Không có tài liệu.</td></tr>'}</tbody></table></div>`;
  let diff = '';
  if (prev) {
    const key = l => l.nv + '|' + l.nguon + '|' + (l.dv || '');
    const pm = Object.fromEntries(prev.lines.map(l => [key(l), l])), cm = Object.fromEntries(cur.lines.map(l => [key(l), l]));
    const rows = [];
    cur.lines.forEach(l => { const o = pm[key(l)]; if (!o) rows.push(['Thêm', l, 0, l.deNghi]); else if (o.deNghi !== l.deNghi || o.canCu !== l.canCu) rows.push(['Sửa', l, o.deNghi, l.deNghi]); });
    prev.lines.forEach(l => { if (!cm[key(l)]) rows.push(['Xóa', l, l.deNghi, 0]); });
    const tAdd = cur.taiLieu.filter(t => !prev.taiLieu.some(p => p.id === t.id)), tDel = prev.taiLieu.filter(t => !cur.taiLieu.some(p => p.id === t.id));
    diff = `<div><h4 style="margin:0 0 6px">Thay đổi so với v${prev.v}</h4>
      ${rows.length ? `<div class="tw"><table class="t"><thead><tr><th>Thay đổi</th><th>Nhiệm vụ</th><th>Nguồn</th><th class="num">v${prev.v}</th><th class="num">v${cur.v}</th><th class="num">Chênh lệch</th></tr></thead><tbody>${rows.map(([k, l, a, b]) => `<tr><td>${chip(k, k === 'Xóa' ? 'bad' : k === 'Thêm' ? 'ok' : 'warn')}</td><td>${esc(nm('nhiemVu', l.nv))}</td><td>${esc(nm('nguon', l.nguon))}</td><td class="num">${fmt(a)}</td><td class="num">${fmt(b)}</td><td class="num ${b - a < 0 ? 'diff-down' : 'diff-up'}">${fmtS(b - a)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small" style="margin:0">Không thay đổi số liệu.</p>'}
      ${tAdd.length ? `<p class="small" style="margin:6px 0 0"><b>Tài liệu bổ sung:</b> ${tAdd.map(t => esc(t.ten)).join(', ')}</p>` : ''}
      ${tDel.length ? `<p class="small" style="margin:6px 0 0"><b>Tài liệu bỏ ra:</b> ${tDel.map(t => esc(t.ten)).join(', ')}</p>` : ''}</div>`;
  }
  return `<div class="pb stack">${list}
    <div class="callout lock"><b>Phiên bản v${cur.v} – bản lưu, chỉ xem</b><p class="small">Gửi lúc ${dtt(cur.t)} bởi ${esc(cur.nguoi)}. Số liệu, tài liệu và kết quả xử lý của phiên bản này được giữ nguyên để đối chiếu, không ai sửa được.</p></div>
    ${kq}${cur.bcTT ? `<div class="callout info"><b>Báo cáo thẩm tra kèm v${cur.v}: ${esc(cur.bcTT.so)} ngày ${dt(cur.bcTT.ngay)}</b><p>${sigBadge(cur.bcTT.kySo)}</p></div>` : ''}${cur.giaiTrinh ?`<div class="callout info"><b>Nội dung giải trình kèm v${cur.v}</b><p>${esc(cur.giaiTrinh)}</p></div>` : ''}
    <div><h4 style="margin:0 0 6px">Tài liệu</h4>${docs}</div>
    <div><h4 style="margin:0 0 6px">Số liệu</h4>${lines}</div>
    ${diff}</div>`;
}

function lsTab(h) {
  const L = S.log.filter(l => l.hs === h.id).slice().reverse();
  return `<div class="pb"><ul class="tl">${L.map(l => `<li class="${/Trả|Yêu cầu/.test(l.act) ? 'w' : /Thông qua|Giao|Tiếp nhận|Đạt/.test(l.act) ? 'o' : ''}"><div class="when">${dtt(l.t)} · Bước ${l.buoc} · ${esc(ROLES[l.role].ten)} – ${esc(ROLES[l.role].nguoi)}</div><div class="what">${esc(l.act)}</div>${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</li>`).join('')}</ul></div>`;
}

function vHoSo() {
  const h = S.hoSo.find(x => x.id === U.p.id);
  if (!h) { U.view = 'hoso'; return vList(); }
  const n = stOf(h), tab = U.tab || 'ct';
  const tabs = [['ct', 'Chi tiết dự toán'], ['ng', h.loai === 'DT' ? 'Nguồn & cân đối' : 'Căn cứ'], ['tl', `Tài liệu (${h.taiLieu.length})`], ['pb', `Phiên bản (${h.versions.length})`]].concat(h.bcTT || h.lines.some(l => l.thamTra !== null) ? [['bc', 'Báo cáo thẩm tra']] : [], [['ls', 'Lịch sử xử lý'], ['luong', 'Vị trí trên sơ đồ']]);
  const body = {ct: () => linesTable(h), ng: () => nguonTab(h), tl: () => tlTab(h), pb: () => pbTab(h), bc: () => bcDoc(h), ls: () => lsTab(h), luong: () => `<div class="pb tw">${flowSvg(h)}</div>`}[tab]();
  const lr = h.lastReturn && n.ret ? `<div class="callout" style="margin-bottom:12px"><b>Hồ sơ bị trả lại ở Bước ${h.lastReturn.buoc} – ${esc(ROLES[h.lastReturn.role].ten)} (${dtt(h.lastReturn.t)})</b><p>${esc(h.lastReturn.note)}</p><p class="small" style="margin-top:6px">Phiên bản ${h.phienBan - 1} đã được lưu và khóa cùng toàn bộ tài liệu, số liệu (xem tab Phiên bản). Đơn vị đang chỉnh sửa trên phiên bản ${h.phienBan} được sinh ra từ phiên bản ${h.phienBan - 1}.</p></div>` : '';
  const lock = nodeOf(h) === 'n7' ? `<div class="callout lock" style="margin-bottom:12px"><b>Phiên bản ${h.phienBan} đang được cấp có thẩm quyền xem xét – đã khóa</b><p>Trình lúc ${dtt(h.trinhAt)} · Tờ trình ${esc(h.toTrinh?.so || '')}. Không ai được sửa cho đến khi có quyết định.</p></div>` : '';
  return pageHead(`<a href="#" ${go('hoso')}>Hồ sơ</a> / ${esc(h.ma)}`, esc(h.ten),
    `${h.loai === 'DT' ? 'Hồ sơ dự toán năm' : 'Hồ sơ điều chỉnh/bổ sung'} · ${esc(h.ma)} · Phiên bản ${h.phienBan} · Đơn vị lập: Sở, ban, ngành hoặc UBND xã, phường`, stChip(h))
    + `<section class="panel" style="margin-bottom:14px"><div class="pb">${stepper(h)}</div></section>` + lr + lock
    + `<div class="hsgrid">
      <section class="panel" style="min-width:0"><div class="tabs">${tabs.map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${t}</button>`).join('')}</div>${body}</section>
      <section class="panel">${actionPanel(h)}</section>
    </div>`;
}

/* ================= KHUNG XỬ LÝ, PHÂN BỔ, GIAO ================= */
const todayIso = () => isoDay(new Date());
/* Nội dung điền sẵn cho các ô nhập liệu khi demo */
const DEF_YK = 'Dự toán lập đúng định mức, căn cứ đầy đủ, cân đối được nguồn. Đề nghị trình HĐND tỉnh xem xét, quyết định.';
const DEF_TT_RET = 'Đề nghị đơn vị bổ sung thuyết minh căn cứ định mức cho các nhiệm vụ có mức đề nghị tăng trên 10% so với năm trước.';
const DEF_QD_RET = 'Đề nghị làm rõ cơ sở tăng chi sự nghiệp giáo dục so với năm trước và bổ sung thuyết minh nguồn kết dư.';
const defGT = h => h.lastReturn ? `Tiếp thu ý kiến của ${ROLES[h.lastReturn.role].ten}: “${h.lastReturn.note}” Đơn vị đã rà soát, điều chỉnh số liệu và bổ sung thuyết minh tương ứng.` : '';
const F = (k, d) => (U.f && U.f[k] !== undefined ? U.f[k] : d);
const dl = rows => `<div class="stack" style="gap:6px">${rows.map(([k, v]) => `<div class="row" style="justify-content:space-between"><span class="muted small">${k}</span><b class="tnum">${v}</b></div>`).join('')}</div>`;

function missingBM(h) {
  if (h.loai === 'DC') {
    const need = ['BM01'].concat(h.lines.some(l => l.kieu === 'bs') ? ['BM04'] : []);
    return need.filter(b => !h.taiLieu.some(t => t.bm === b));
  }
  return DM.bieuMau.filter(b => b.bb && kyOf(h.nam).bieuMau.includes(b.ma) && !h.taiLieu.some(t => t.bm === b.ma)).map(b => b.ma);
}

function validateHs(h) {
  const c = [], warn = [];
  const ky = kyOf(h.nam);
  c.push({ok: !!(h.ten || '').trim(), t: 'Có tên hồ sơ'});
  c.push({ok: h.lines.length > 0, t: 'Có ít nhất một dòng dự toán'});
  const bad = h.lines.filter(l => !l.nguon || !l.loai || !l.nv || !(l.canCu || '').trim() || (h.loai === 'DT' ? !(l.deNghi > 0) : (!l.deNghi || (l.soTruoc || 0) + l.deNghi < 0)) || (h.loai === 'DC' && !l.dv));
  c.push({ok: h.lines.length > 0 && !bad.length, t: h.loai === 'DT' ? 'Mỗi dòng đủ nguồn, loại kinh phí, nhiệm vụ, số tiền > 0 và căn cứ' : 'Mỗi dòng đủ thông tin; tăng/giảm ≠ 0 và số sau không âm', n: bad.length});
  if (h.loai === 'DT') {
    c.push({ok: h.nguonDK.length > 0 && h.nguonDK.every(g => g.nguon && g.so > 0 && (g.vb || '').trim()), t: 'Khai báo nguồn kinh phí dự kiến kèm văn bản căn cứ'});
    c.push({ok: ky && ky.st === 'Đang mở tiếp nhận', t: `Kỳ lập dự toán ${h.nam} đang mở tiếp nhận`});
    canDoi(h, 'deNghi').filter(x => x.cl < 0).forEach(x => warn.push(`${x.ten}: tổng chi vượt nguồn dự kiến ${fmt(-x.cl)} đ`));
    const ct = S.capTren[h.nam];
    if (ct) CT_NGUON.forEach(n => { const g = sum(h.nguonDK.filter(x => x.nguon === n), x => x.so || 0); if (g !== ct.soKT[n]) warn.push(`${nm('nguon', n)}: nguồn dự kiến ${fmt(g)} đ khác số cấp trên giao ${fmt(ct.soKT[n])} đ`); });
    h.lines.forEach(l => { const d = dmOf(l.nv, h.nam); if (d && Math.abs(l.deNghi - d.tien) > d.tien * 0.05) warn.push(`${nm('nhiemVu', l.nv)}: ${l.deNghi > d.tien ? 'vượt' : 'thấp hơn'} định mức ${fmt(Math.abs(l.deNghi - d.tien))} đ`); });
  }
  c.push({ok: h.taiLieu.length > 0, t: 'Có tài liệu đính kèm'});
  if (['r2', 'r3'].includes(nodeOf(h))) c.push({ok: !!(h.giaiTrinh || defGT(h)).trim(), t: 'Nhập nội dung giải trình/chỉnh sửa'});
  const m = missingBM(h);
  if (m.length) warn.push('Chưa đính kèm: ' + m.map(x => nm('bieuMau', x)).join(', '));
  return {checks: c, ok: c.every(x => x.ok), warn};
}
const checkList = cs => `<ul style="list-style:none;margin:0;padding:0" class="stack small">${cs.map(x => `<li style="display:flex;gap:8px"><b style="color:var(${x.ok ? '--ok' : '--bad'})">${x.ok ? '✓' : '✗'}</b><span>${esc(x.t)}${x.n ? ` (${x.n} dòng chưa đạt)` : ''}</span></li>`).join('')}</ul>`;

function summaryBox(h) {
  const rows = [['Tổng đề nghị', fmtS(hsTot(h, 'deNghi')).replace(/^\+/, h.loai === 'DC' ? '+' : '') + ' đ']];
  if (h.lines.some(l => l.thamTra !== null)) rows.push(['Sau thẩm tra', fmt(hsTot(h, 'thamTra')) + ' đ']);
  if (isApproved(h)) {
    const pb = sum(S.phanBo.filter(p => p.hoSoId === h.id && p.chot), p => p.so), g = sum(S.phanBo.filter(p => p.hoSoId === h.id), p => p.daGiao);
    rows.push(['Được duyệt', fmt(hsTot(h, 'duyet')) + ' đ'], ['Đã phân bổ', fmt(pb) + ' đ'], ['Đã giao', fmt(g) + ' đ']);
    if (h.toTrinh) rows.push(['Tờ trình', esc(h.toTrinh.so) + (h.toTrinh.kySo ? ' · đã ký số' : '')]);
    if (h.quyetDinh) rows.push(['Văn bản quyết định', esc(h.quyetDinh.so) + ' · ' + dt(h.quyetDinh.ngay) + (h.quyetDinh.kySo ? ' · đã ký số' : '')]);
  }
  return `<div style="border-top:1px solid var(--line-2);padding-top:12px">${dl(rows)}</div>`;
}

/* Báo cáo thẩm tra: lập từ mức sau thẩm tra và ý kiến thẩm tra; chốt và ký số khi trình (Bước 6) */
function bcDoc(h) {
  const bc = h.bcTT, draft = !bc, dc = h.loai === 'DC';
  const ch = h.lines.filter(l => l.thamTra !== null && l.thamTra !== l.deNghi);
  const tDN = hsTot(h, 'deNghi'), tTT = hsTot(h, 'thamTra');
  const cd = dc ? [] : canDoi(h, 'thamTra');
  const tn = S.log.filter(l => l.hs === h.id && /^Tiếp nhận/.test(l.act)).pop();
  const so = n => fmtS(n).replace(/^\+/, dc ? '+' : '');
  return `<div class="pb"><div class="doc">
    <div class="hd"><div><b>SỞ TÀI CHÍNH TỈNH VĨNH LONG</b><b>PHÒNG QUẢN LÝ NGÂN SÁCH</b><span>Số: ${esc(bc ? bc.so : '…/BC-STC')}</span></div><div><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><u><b>Độc lập – Tự do – Hạnh phúc</b></u><br><i>Vĩnh Long, ngày ${dt(bc ? bc.ngay : todayIso())}</i></div></div>
    ${draft ? '<div style="text-align:center;margin-top:10px"><span class="draft">DỰ THẢO</span></div>' : ''}
    <h4>BÁO CÁO THẨM TRA</h4><div class="sub">${esc(h.ten)}</div>
    <p><b>I. Hồ sơ thẩm tra.</b> Hồ sơ ${esc(h.ma)}, phiên bản ${h.phienBan}, do đơn vị dự toán lập${tn ? `; tiếp nhận ngày ${dt(tn.t)}` : ''}. Tổng ${dc ? 'tăng/giảm đề nghị' : 'dự toán đề nghị'}: ${so(tDN)} đồng.</p>
    <p><b>II. Kết quả thẩm tra.</b> Tổng mức sau thẩm tra: ${so(tTT)} đồng (chênh lệch ${fmtS(tTT - tDN)} đồng so với đề nghị).</p>
    ${ch.length ? `<table><thead><tr><th>Nhiệm vụ</th><th>Đề nghị</th><th>Sau thẩm tra</th><th>Chênh lệch</th><th>Ý kiến</th></tr></thead><tbody>${ch.map(l => `<tr><td>${esc(nm('nhiemVu', l.nv))}</td><td class="num">${fmt(l.deNghi)}</td><td class="num">${fmt(l.thamTra)}</td><td class="num">${fmtS(l.thamTra - l.deNghi)}</td><td>${esc(l.ykTT)}</td></tr>`).join('')}</tbody></table>` : '<p>Các nhiệm vụ thống nhất với mức đề nghị của đơn vị.</p>'}
    ${cd.length ? `<p>Cân đối nguồn: ${cd.map(x => `${esc(x.ten)} ${x.cl < 0 ? `vượt ${fmt(-x.cl)} đồng` : 'cân đối được'}`).join('; ')}.</p>` : ''}
    <p><b>III. Ý kiến thẩm tra.</b> ${esc(h.ykienTT || DEF_YK)}</p>
    <p><b>IV. Kiến nghị.</b> Đề nghị UBND tỉnh, HĐND tỉnh xem xét, quyết định theo thẩm quyền.</p>
    <div class="signbox"><b>KT. GIÁM ĐỐC SỞ TÀI CHÍNH<br>TRƯỞNG PHÒNG</b><br>${bc && bc.kySo ? sigBadge(bc.kySo) : '<i>(Ký số khi trình)</i>'}<br>${esc(ROLES.thamtra.nguoi)}</div>
  </div><p class="small muted">${draft ? 'Dự thảo tự cập nhật theo mức sau thẩm tra và ý kiến thẩm tra; được chốt và ký số khi trình cấp có thẩm quyền (Bước 6).' : 'Báo cáo đã chốt và ký số khi trình – là thành phần của hồ sơ trình.'}</p></div>`;
}

function actionPanel(h) {
  const n = stOf(h), nd = nodeOf(h);
  const head = `<header><h3>Xử lý hồ sơ</h3><p>Bước ${n.buoc}: ${esc(n.ten)}</p></header>`;
  if (n.role !== U.role) {
    return head + `<div class="pb stack"><p style="margin:0">Hồ sơ đang chờ <b>${esc(ROLES[n.role].ten)}</b> (${esc(ROLES[n.role].nguoi)}) xử lý. Vai trò hiện tại chỉ xem.</p>
      <button class="btn pri" data-act="asRole" data-role="${n.role}">Đổi sang tài khoản ${esc(ROLES[n.role].nguoi)}</button>${summaryBox(h)}</div>`;
  }
  if (isEditable(h)) {
    const v = validateHs(h), resend = h.versions.length > 0;
    return head + `<div class="pb stack">
      <div class="fld"><label for="h-ten">Tên hồ sơ <i>*</i></label>${txt('h-ten', 'h:ten', h.ten)}</div>
      ${['r2', 'r3'].includes(nd) ? `<div class="fld"><label for="h-gt">Nội dung giải trình/chỉnh sửa <i>*</i></label>${area('h-gt', 'h:giaiTrinh', h.giaiTrinh || defGT(h), false, 'Nêu rõ đã chỉnh sửa gì theo yêu cầu')}</div>` : ''}
      <div><b class="small">Kiểm tra trước khi gửi</b><div style="margin-top:6px">${checkList(v.checks)}</div></div>
      ${v.warn.length ? `<div class="callout"><b>Lưu ý (không chặn gửi)</b><p class="small">${v.warn.map(esc).join('<br>')}</p></div>` : ''}
      <div class="row"><button class="btn" data-act="saveDraft">Lưu nháp</button><button class="btn pri" data-act="kyAsk" data-next="send" data-vb="Hồ sơ ${esc(h.ma)} – phiên bản ${h.phienBan}" ${v.ok ? '' : 'disabled'}>Ký số &amp; ${resend ? 'gửi lại' : 'gửi hồ sơ'} (phiên bản ${h.phienBan})</button></div>
      <p class="small muted" style="margin:0">Khi gửi, hệ thống ghi nhận người gửi, thời gian và lưu phiên bản để đối chiếu.</p>${summaryBox(h)}</div>`;
  }
  if (nd === 'n4') {
    const miss = missingBM(h), allChk = DM.checklist.every((_, i) => h.checklist[i]);
    const defNote = miss.length ? 'Đề nghị bổ sung: ' + miss.map(x => nm('bieuMau', x)).join(', ') + '.' : '';
    return head + `<div class="pb stack">
      <div><b class="small">Thành phần hồ sơ (hệ thống tự kiểm tra)</b><div style="margin-top:6px">${checkList([{ok: !miss.length, t: miss.length ? 'Thiếu: ' + miss.map(x => nm('bieuMau', x)).join(', ') : 'Đủ thành phần hồ sơ bắt buộc'}])}</div></div>
      <div><b class="small">Cán bộ kiểm tra</b>${DM.checklist.map((t, i) => `<label class="chk small" for="c-${i}"><input type="checkbox" id="c-${i}" data-bind="c:${i}" ${h.checklist[i] ? 'checked' : ''}>${esc(t)}</label>`).join('')}</div>
      <div class="fld"><label for="f-note">Nội dung cần bổ sung (khi trả lại)</label>${area('f-note', 'f:note', F('note', defNote))}</div>
      <div class="row"><button class="btn okb" data-act="tnOk" ${!miss.length && allChk ? '' : 'disabled'} title="Cần đủ thành phần và tích đủ các mục kiểm tra">Tiếp nhận, chuyển thẩm tra</button><button class="btn danger" data-act="tnRet">Trả lại bổ sung</button></div>${summaryBox(h)}</div>`;
  }
  if (nd === 'n5') {
    const vuot = h.loai === 'DT' ? canDoi(h, 'thamTra').filter(x => x.cl < 0) : [];
    const nul = h.lines.filter(l => l.thamTra === null).length;
    return head + `<div class="pb stack">
      <p class="small muted" style="margin:0">Rà soát từng nguồn và nhiệm vụ: căn cứ, mục đích, khả năng cân đối nguồn, mức kinh phí, tiêu chuẩn/định mức. Nhập mức sau thẩm tra và ý kiến ở tab <b>Chi tiết dự toán</b>.</p>
      ${h.loai === 'DT' ? `<div><b class="small">Cân đối nguồn theo mức sau thẩm tra</b><div style="margin-top:6px">${checkList(vuot.length ? vuot.map(x => ({ok: false, t: `${x.ten} vượt ${fmt(-x.cl)} đ`})) : [{ok: true, t: 'Tất cả nguồn cân đối được'}])}</div></div>` : ''}
      ${nul ? `<button class="btn" data-act="ttFill">Lấy số đề nghị làm mức sau thẩm tra (${nul} dòng)</button>` : ''}
      <div class="fld"><label for="h-yk">Ý kiến thẩm tra chung <i>*</i></label>${area('h-yk', 'h:ykienTT', h.ykienTT || DEF_YK, false, 'Kết luận thẩm tra')}</div>
      <div class="fld"><label for="f-note">Yêu cầu giải trình/chỉnh sửa (khi chưa đạt)</label>${area('f-note', 'f:note', F('note', vuot.length ? `Tổng chi ${vuot.map(x => x.ten).join(', ')} vượt nguồn dự kiến ${vuot.map(x => fmt(-x.cl) + ' đ').join(', ')}. Đề nghị đơn vị rà soát, điều chỉnh và giải trình.` : DEF_TT_RET))}</div>
      <div class="row"><button class="btn okb" data-act="ttOk">Đạt yêu cầu</button><button class="btn danger" data-act="ttRet">Yêu cầu giải trình/chỉnh sửa</button></div>${summaryBox(h)}</div>`;
  }
  if (nd === 'n6') {
    const gt = h.versions.filter(v => v.giaiTrinh).length;
    return head + `<div class="pb stack">
      <div><b class="small">Hồ sơ trình gồm</b><div style="margin-top:6px">${checkList([{ok: true, t: `Hồ sơ dự toán phiên bản ${h.phienBan}`}, {ok: !!h.ykienTT, t: 'Ý kiến thẩm tra'}, {ok: true, t: gt ? `Nội dung giải trình (${gt} lần)` : 'Nội dung giải trình: không có'}, {ok: true, t: `Số liệu tổng hợp sau thẩm tra: ${fmt(hsTot(h, 'thamTra'))} đ`}])}</div></div>
      <div class="form"><div class="fld"><label for="f-ttso">Số tờ trình <i>*</i></label>${txt('f-ttso', 'f:ttso', F('ttso', (40 + S.hoSo.length) + '/TTr-BKTNS'))}</div>
      <div class="fld"><label for="f-ttngay">Ngày tờ trình</label><input type="date" class="inp" id="f-ttngay" data-bind="f:ttngay" value="${F('ttngay', todayIso())}"></div></div>
      <button class="btn pri" data-act="kyAsk" data-next="trinh" data-vb="Tờ trình và báo cáo thẩm tra – ${esc(h.ma)}">Ký số &amp; trình cấp có thẩm quyền</button>
      <p class="small muted" style="margin:0">Khi trình, hệ thống ghi thời điểm trình, chốt báo cáo thẩm tra (xem tab Báo cáo thẩm tra) và khóa phiên bản đang xem xét.</p>${summaryBox(h)}</div>`;
  }
  if (nd === 'n7') {
    return head + `<div class="pb stack">
      <p class="small muted" style="margin:0">Xác định mức dự toán được chấp thuận theo từng nguồn, lĩnh vực và nhiệm vụ chi ở cột <b>Được duyệt</b> (mặc định bằng mức sau thẩm tra).</p>
      ${h.ykienTT ? `<div class="callout info"><b>Ý kiến thẩm tra</b><p class="small">${esc(h.ykienTT)}</p></div>` : ''}
      <div class="form"><div class="fld"><label for="f-qdso">Số nghị quyết/quyết định <i>*</i></label>${txt('f-qdso', 'f:qdso', F('qdso', (20 + S.hoSo.length) + '/NQ-HĐND'))}</div>
      <div class="fld"><label for="f-qdngay">Ngày ban hành</label><input type="date" class="inp" id="f-qdngay" data-bind="f:qdngay" value="${F('qdngay', todayIso())}"></div></div>
      <div class="fld"><label for="f-note">Yêu cầu hoàn thiện (khi chưa thống nhất)</label>${area('f-note', 'f:note', F('note', DEF_QD_RET))}</div>
      <div class="row"><button class="btn okb" data-act="kyAsk" data-next="qdOk" data-vb="Nghị quyết/quyết định phê duyệt dự toán – ${esc(h.ma)}">Ký số &amp; thông qua</button><button class="btn danger" data-act="qdRet">Yêu cầu hoàn thiện</button></div>${summaryBox(h)}</div>`;
  }
  if (nd === 'n8' || nd === 'n9') {
    return head + `<div class="pb stack"><p style="margin:0">Dự toán đã được phê duyệt. Bộ phận phân bổ lập phương án phân bổ rồi giao dự toán cho đơn vị nhận.</p>
      <div class="row"><button class="btn pri" ${go('phanbo', {hs: h.id})}>Mở phân bổ (Bước 8)</button><button class="btn" ${go('giao', {hs: h.id})}>Mở giao dự toán (Bước 9)</button></div>${summaryBox(h)}</div>`;
  }
  return head + `<div class="pb stack"><p style="margin:0">Dự toán đã giao. Theo dõi theo nguồn, loại kinh phí, đơn vị nhận, nhiệm vụ và các điều chỉnh/bổ sung.</p>
    <div class="row"><button class="btn pri" ${go('theodoi')}>Theo dõi sau giao</button><button class="btn" ${go('khoan')}>Khoản đã giao</button></div>${summaryBox(h)}</div>`;
}

/* ---------- Bước 8: phân bổ ---------- */
function hsForPB() { return S.hoSo.filter(h => h.nam === U.nam && isApproved(h)); }
function vPhanBo() {
  const list = hsForPB();
  const head = pageHead('Phân bổ & giao', 'Bước 8 · Phân bổ dự toán', 'Lập phương án phân bổ cho từng đơn vị/đầu mối nhận dự toán theo nguồn, loại kinh phí, lĩnh vực và nhiệm vụ chi. Tổng phân bổ không được vượt số được quyết định/phê duyệt.');
  if (!list.length) return head + `<section class="panel"><div class="empty">Năm ${U.nam} chưa có hồ sơ được phê duyệt.</div></section>`;
  const h = list.find(x => x.id === U.p.hs) || list.find(x => x.lines.some(l => (l.duyet || 0) !== pbSumLine(S, l))) || list[0];
  U.p.hs = h.id;
  const E = U.role === 'phanbo';
  const tD = hsTot(h, 'duyet'), tP = sum(S.phanBo.filter(p => p.hoSoId === h.id && p.chot), p => p.so);
  const drafts = S.phanBo.filter(p => p.hoSoId === h.id && !p.chot);
  const rows = h.lines.map(l => {
    const ps = pbOfLine(S, l), chot = sum(ps.filter(p => p.chot), p => p.so), all = sum(ps, p => p.so), rest = (l.duyet || 0) - all;
    const over = Math.sign(all) * Math.sign(l.duyet || 0) < 0 || Math.abs(all) > Math.abs(l.duyet || 0);
    return `<tr style="background:var(--surface-2)"><td><b>${esc(nm('nhiemVu', l.nv))}</b><span class="sub">${esc(nm('linhVuc', l.lv))}${h.loai === 'DC' ? ' · ' + (l.kieu === 'dc' ? 'Điều chỉnh' : 'Bổ sung mới') : ''}</span></td><td>${esc(nm('nguon', l.nguon))}<span class="sub">${esc(nm('loaiKP', l.loai))}</span></td>
      <td class="num"><b>${fmtS(l.duyet).replace(/^\+/, h.loai === 'DC' ? '+' : '')}</b></td><td class="num">${fmt(chot)}</td><td class="num ${over ? 'diff-down' : ''}">${fmt(rest)}${over ? '<span class="sub diff-down">Vượt số được duyệt</span>' : ''}</td>
      <td>${E && rest !== 0 ? `<button class="btn sm" data-act="pbAdd" data-line="${l.id}">+ Phân bổ</button>` : ''}</td></tr>
      ${ps.map(p => `<tr><td style="padding-left:28px" colspan="2">${p.chot ? `↳ ${esc(nm('donVi', p.dv))} ${DM.donVi.find(d => d.ma === p.dv)?.cdt ? '<span class="tag tc">Chủ đầu tư</span>' : ''}` : `<div class="row" style="flex-wrap:nowrap">↳ ${sel('p-dv-' + p.id, 'p:' + p.id + ':dv', DM.donVi, p.dv, l.kieu === 'dc', '— Đơn vị nhận —')}</div>`}</td>
        <td class="num">${p.chot ? fmt(p.so) : money('p-so-' + p.id, 'p:' + p.id + ':so', p.so)}</td><td colspan="2">${p.chot ? (p.daGiao === p.so ? chip('Đã giao', 'ok') : p.daGiao ? chip('Giao một phần', 'info') : chip('Đã phân bổ', 'info')) : chip('Nháp', '')}</td>
        <td>${!p.chot && E ? `<button class="btn sm ghost danger" data-act="pbDel" data-id="${p.id}">Xóa</button>` : ''}</td></tr>`).join('')}`;
  }).join('');
  return head + `<div class="row" style="margin-bottom:12px"><label class="small muted" for="sel-pbhs">Hồ sơ đã phê duyệt:</label><select class="inp" style="width:auto" id="sel-pbhs" data-chg="pbhs">${list.map(x => `<option value="${x.id}" ${x.id === h.id ? 'selected' : ''}>${esc(x.ma)} – ${esc(x.ten)}</option>`).join('')}</select></div>
    <div class="kpis"><div class="kpi"><small>Được duyệt</small><b>${fmt(tD)}</b><span>đồng · ${esc(h.quyetDinh?.so || '')}</span></div><div class="kpi"><small>Đã phân bổ (đã chốt)</small><b>${fmt(tP)}</b><span>đồng</span></div><div class="kpi ${tD - tP ? 'warn' : 'ok'}"><small>Chưa phân bổ</small><b>${fmt(tD - tP)}</b><span>đồng</span></div></div>
    ${!E ? `<div class="callout info" style="margin-bottom:12px"><b>Chế độ xem</b><p>Chỉ vai trò “Bộ phận phân bổ / giao dự toán” được lập phương án. <a href="#" data-act="asRole" data-role="phanbo">Đổi sang tài khoản Bộ phận phân bổ</a></p></div>` : ''}
    <section class="panel"><header><h3>Phương án phân bổ</h3>${E ? `<div class="row"><button class="btn" data-act="pbAuto">Đề xuất theo đơn vị mặc định</button><button class="btn pri" data-act="pbChot" ${drafts.length ? '' : 'disabled'}>Chốt phương án phân bổ (${drafts.length})</button></div>` : ''}</header>
    <div class="tw"><table class="t"><thead><tr><th>Nhiệm vụ / đơn vị nhận</th><th>Nguồn · loại KP</th><th class="num">Được duyệt / phân bổ (đ)</th><th class="num">Đã chốt</th><th class="num">Còn chưa phân bổ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

/* ---------- Bước 9: giao ---------- */
/* QĐ giao quyền tự chủ đã dùng cho đơn vị này trong năm (điền sẵn khi giao điều chỉnh) */
const defTC = (nam, dv) => (S.vbGiao.find(v => v.nam === nam && v.dv === dv && v.soQDTuChu) || {}).soQDTuChu || '';
const tcDefault = (h, dv, ngay) => defTC(h.nam, dv) || `${parseInt(vbNo(h.nam), 10) + 40}/QĐ-UBND ngày ${dt(ngay)}`;
function vGiao() {
  const head = pageHead('Phân bổ & giao', 'Bước 9 · Giao dự toán', 'Giao dự toán cho từng đơn vị/đầu mối nhận. Ghi số, ngày văn bản, ngày giao, đơn vị nhận, nguồn, loại kinh phí, nhiệm vụ và số tiền. Số giao không vượt số đã phân bổ.');
  const pending = S.phanBo.filter(p => p.nam === U.nam && p.chot && p.so - p.daGiao !== 0);
  const vbs = S.vbGiao.filter(v => v.nam === U.nam).slice().reverse();
  const hist = `<section class="panel" style="margin-top:16px"><header><h3>Văn bản giao dự toán đã ban hành năm ${U.nam}</h3><p>${vbs.length} văn bản</p></header><div class="tw"><table class="t"><thead><tr><th>Số văn bản</th><th>Ngày giao</th><th>Đơn vị nhận</th><th>Loại văn bản</th><th>Hồ sơ</th><th class="num">Số tiền (đ)</th><th>Ký số</th></tr></thead><tbody>
    ${vbs.map(v => `<tr><td><b>${esc(v.so)}</b></td><td>${dt(v.ngayGiao)}</td><td>${esc(nm('donVi', v.dv))}</td><td class="small">${esc(v.loaiVB)}${v.soQDTuChu ? `<span class="sub">QĐ giao quyền tự chủ: ${esc(v.soQDTuChu)}</span>` : ''}</td><td>${esc(S.hoSo.find(x => x.id === v.hoSoId)?.ma || '')}</td><td class="num">${fmtS(sum(v.rows, r => r.so)).replace(/^\+/, '')}</td><td>${sigBadge(v.kySo)}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Chưa có.</td></tr>'}</tbody></table></div></section>`;
  if (!pending.length) return head + `<section class="panel"><div class="empty">Không còn khoản đã phân bổ chờ giao trong năm ${U.nam}.</div></section>` + hist;
  const hsIds = [...new Set(pending.map(p => p.hoSoId))];
  const hsId = hsIds.includes(U.p.hs) ? U.p.hs : hsIds[0]; U.p.hs = hsId;
  const h = S.hoSo.find(x => x.id === hsId);
  const dvs = [...new Set(pending.filter(p => p.hoSoId === hsId).map(p => p.dv))];
  const dv = dvs.includes(U.p.dv) ? U.p.dv : dvs[0]; U.p.dv = dv;
  const rows = pending.filter(p => p.hoSoId === hsId && p.dv === dv).map(p => ({p, l: h.lines.find(x => x.id === p.lineId)}));
  const inc = rows.filter(({p}) => F('gi:' + p.id, true));
  const hasTC = inc.some(({l}) => l.loai === 'TC');
  const vbOpts = (hasTC ? DM.vbGiao.TC : []).concat(DM.vbGiao.KTC).map(x => ({ma: x, ten: x}));
  const defVB = h.loai === 'DC' ? DM.vbGiao.KTC[1] : (hasTC ? DM.vbGiao.TC[0] : DM.vbGiao.KTC[0]);
  const loaiVB = vbOpts.some(o => o.ma === F('vbloai')) ? F('vbloai') : defVB;
  const E = U.role === 'phanbo';
  const amt = p => F('ga:' + p.id, p.so - p.daGiao);
  const total = sum(inc, ({p}) => amt(p));
  const dvRec = DM.donVi.find(d => d.ma === dv);
  const soVB = F('vbso', vbNo(h.nam)), ngay = F('vbngay', todayIso());
  return head + `<div class="row" style="margin-bottom:12px"><label class="small muted" for="sel-ghs">Hồ sơ:</label><select class="inp" style="width:auto" id="sel-ghs" data-chg="ghs">${hsIds.map(id => { const x = S.hoSo.find(y => y.id === id); return `<option value="${id}" ${id === hsId ? 'selected' : ''}>${esc(x.ma)} – ${esc(x.ten)}</option>`; }).join('')}</select></div>
  ${!E ? `<div class="callout info" style="margin-bottom:12px"><b>Chế độ xem</b><p>Chỉ vai trò “Bộ phận phân bổ / giao dự toán” được giao. <a href="#" data-act="asRole" data-role="phanbo">Đổi sang tài khoản Bộ phận phân bổ</a></p></div>` : ''}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start">
    <div class="stack">
      <section class="panel"><header><h3>Đơn vị nhận chờ giao</h3></header><div class="pb row">${dvs.map(d => `<button class="btn sm ${d === dv ? 'pri' : ''}" data-act="gdv" data-dv="${d}">${esc(nm('donVi', d))} · ${fmt(sum(pending.filter(p => p.hoSoId === hsId && p.dv === d), p => p.so - p.daGiao))}</button>`).join('')}</div></section>
      <section class="panel"><header><h3>Khoản giao cho ${esc(dvRec.ten)}${dvRec.cdt ? ' <span class="tag tc">Chủ đầu tư</span>' : ''}</h3></header>
      <div class="tw"><table class="t"><thead><tr><th></th><th>Nhiệm vụ</th><th>Nguồn · loại KP</th><th class="num">Đã phân bổ</th><th class="num">Đã giao</th><th class="num">Số giao lần này (đ)</th></tr></thead><tbody>
      ${rows.map(({p, l}) => `<tr><td><input type="checkbox" id="gi-${p.id}" data-bind="f:gi:${p.id}" ${F('gi:' + p.id, true) ? 'checked' : ''} ${E ? '' : 'disabled'} aria-label="Chọn khoản"></td><td>${esc(nm('nhiemVu', l.nv))}</td><td>${esc(nm('nguon', l.nguon))}<span class="sub">${esc(nm('loaiKP', l.loai))}</span></td><td class="num">${fmt(p.so)}</td><td class="num">${fmt(p.daGiao)}</td><td class="num" style="min-width:150px">${money('ga-' + p.id, 'f:ga:' + p.id, amt(p), !E)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td></td><td colspan="4">Tổng giao lần này</td><td class="num">${fmtS(total).replace(/^\+/, '')}</td></tr></tfoot></table></div>
      <div class="pb form">
        <div class="fld"><label for="f-vbso">Số văn bản giao <i>*</i></label>${txt('f-vbso', 'f:vbso', soVB, !E)}</div>
        <div class="fld"><label for="f-vbngay">Ngày văn bản</label><input type="date" class="inp" id="f-vbngay" data-bind="f:vbngay" value="${ngay}" ${E ? '' : 'readonly'}></div>
        <div class="fld"><label for="f-vbgiao">Ngày giao</label><input type="date" class="inp" id="f-vbgiao" data-bind="f:vbgiao" value="${F('vbgiao', ngay)}" ${E ? '' : 'readonly'}></div>

/* ================= THEO DÕI SAU GIAO, QUẢN TRỊ, SƠ ĐỒ ================= */
function barCell(d, p, g) {
  const base = Math.max(d, p, g, 1);
  return `<div class="bar" title="Đã giao ${fmt(g)} · Phân bổ chưa giao ${fmt(p - g)} · Chưa phân bổ ${fmt(d - p)}"><span class="g" style="width:${Math.max(0, g / base * 100)}%"></span><span class="p" style="width:${Math.max(0, (p - g) / base * 100)}%"></span></div>`;
}
const legend = `<div class="legend"><span style="--c:var(--bar-giao)">Đã giao</span><span style="--c:var(--bar-pb)">Đã phân bổ, chưa giao</span><span style="--c:var(--bar-chua)">Chưa phân bổ</span></div>`;

function flowSvg(h, mini) {
  const path = h ? h.path : [], cur = h ? nodeOf(h) : null;
  const pairs = new Set(); for (let i = 1; i < path.length; i++) pairs.add(path[i - 1] + '>' + path[i]);
  if (h && cur === 'n10') pairs.add('n10>end');
  const vis = new Set(path);
  const W = 1410, H = 1030;
  let s = `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ luồng nghiệp vụ 10 bước" ${mini ? 'style="min-width:0"' : ''}>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--faint)"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--brand-2)"/></marker></defs>`;
  LANES.forEach(([x, w, t, c]) => {
    s += `<rect class="lanebg" x="${x}" y="46" width="${w}" height="${H - 46}"/><rect class="lanebd" x="${x}" y="0" width="${w}" height="${H}"/>
      <rect x="${x}" y="0" width="${w}" height="46" fill="${c}" class="lanehd"/><text x="${x + w / 2}" y="28" text-anchor="middle" font-size="14" font-weight="700" style="fill:#13223A">${t.length > 24 ? `<tspan x="${x + w / 2}" dy="-8">Bộ phận phân bổ /</tspan><tspan x="${x + w / 2}" dy="17">giao dự toán</tspan>` : t}</text>`;
  });
  FE.forEach(([a, b, pts, lb, lp]) => {
    const on = pairs.has(a + '>' + b);
    s += `<polyline class="edge ${on ? 'vis' : ''}" points="${pts.map(p => p.join(',')).join(' ')}" marker-end="url(#${on ? 'ahv' : 'ah'})"/>`;
    if (lb) s += `<text class="lbl" x="${lp[0]}" y="${lp[1]}" text-anchor="middle">${lb}</text>`;
  });
  s += `<circle class="dot" cx="93" cy="68" r="11"/><circle class="dot" cx="1290" cy="1001" r="11"/>`;
  Object.entries(FN).forEach(([id, [x, y, w, hh, lines, kind]]) => {
    const isCur = id === cur, cls = isCur ? (NODE[id].ret ? 'curw' : 'cur') : vis.has(id) ? 'vis' : '';
    const cx = x + w / 2, cy = y + hh / 2;
    const shape = kind === 1 ? `<polygon points="${cx},${y} ${x + w},${cy} ${cx},${y + hh} ${x},${cy}"/>` : `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="6"/>`;
    const fs = kind === 1 ? 12 : 14;
    const tx = lines.map((t, i) => `<tspan x="${cx}" dy="${i === 0 ? -(lines.length - 1) * fs * 0.6 : fs * 1.2}">${t}</tspan>`).join('');
    s += `<g class="node ${kind === 2 ? 'ret' : ''} ${cls}">${isCur ? `<rect class="halo" x="${x - 4}" y="${y - 4}" width="${w + 8}" height="${hh + 8}" rx="9"/>` : ''}${shape}<text x="${cx}" y="${cy + fs * 0.35}" text-anchor="middle" font-size="${fs}">${tx}</text></g>`;
  });
  return s + '</svg>';
}

/* Ô "Theo định mức" trong bảng chi tiết dự toán năm: số lượng × định mức, cảnh báo khi lệch quá 5% */
function dmCell(h, l) {
  const d = dmOf(l.nv, h.nam);
  if (!d) return '<td class="num muted">—</td>';
  const lech = (l.deNghi || 0) - d.tien, bad = Math.abs(lech) > d.tien * 0.05;
  return `<td class="num" style="min-width:150px">${fmt(d.tien)}<span class="sub">${fmt(d.sl)} ${d.dvt} × ${d.dm.toLocaleString('vi-VN')} tr</span>${bad ? `<span class="dmwarn">${lech > 0 ? 'Vượt' : 'Thấp hơn'} định mức ${fmt(Math.abs(lech))}</span>` : ''}</td>`;
}

function roleStat(r) {

  if (r === 'theodoi') { const a = yearAgg(S, nam); return {main: a.khoan.length + ' khoản', note: fmtTy(a.giao) + ' tỷ đã giao (' + nam + ')'}; }

function moneyRows(rows) {
  const max = Math.max(1, ...rows.map(r => Math.abs(r[1] || 0)));
  return `<div class="mrows">${rows.map(([t, v, note]) => `<div class="mrow"><span class="mt">${t}</span><b class="tnum">${v === null ? '—' : fmtTy(v)}</b><span class="mbar"><i style="width:${v === null ? 0 : Math.abs(v) / max * 100}%"></i></span>${note ? `<small>${note}</small>` : ''}</div>`).join('')}</div>`;
}
function dvList(items, more) {
  if (!items.length) return '<p class="small muted" style="margin:0">Chưa giao cho đơn vị nào.</p>';
  return `<div class="stack" style="gap:6px">${items.map(x => `<div class="row small" style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(x.ten)}</span><b class="tnum">${fmt(x.so)}</b></div>`).join('')}${more ? `<a class="small" href="#" ${go('khoan')}>+ ${more} đơn vị khác – xem khoản đã giao</a>` : ''}</div>`;
}
/* Hành trình của một hồ sơ: dòng tiền, đường đi qua các vai trò, đơn vị nhận */
function journey(h) {
  const n = stOf(h), appr = isApproved(h);
  const pbs = S.phanBo.filter(p => p.hoSoId === h.id), vbs = S.vbGiao.filter(v => v.hoSoId === h.id);
  const L = S.log.filter(l => l.hs === h.id);
  const tl = `<ul class="tl compact">${L.map(l => `<li class="${/Trả|Yêu cầu/.test(l.act) ? 'w' : /Thông qua|Giao|Tiếp nhận|Đạt/.test(l.act) ? 'o' : ''}"><div class="what small">Bước ${l.buoc} · ${esc(l.act)}</div><div class="when">${dtt(l.t)} · ${esc(ROLES[l.role].ten)} – ${esc(ROLES[l.role].nguoi)}</div>${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}</li>`).join('')}
    <li class="cur"><div class="what small">${nodeOf(h) === 'n10' ? 'Đang theo dõi sau giao' : `Đang ở Bước ${n.buoc}: ${esc(n.ten)}`}</div><div class="when">${nodeOf(h) === 'n10' ? esc(ROLES.theodoi.ten) : 'Chờ ' + esc(ROLES[n.role].ten) + ' – ' + esc(ROLES[n.role].nguoi)}</div></li></ul>`;
  const rows = [];
  if (h.loai === 'DT') rows.push(['Nguồn dự kiến', sum(h.nguonDK, g => g.so || 0), h.nguonDK.length + ' nguồn · Đơn vị lập']);
  rows.push([h.loai === 'DT' ? 'Đề nghị' : 'Tăng/giảm đề nghị', hsTot(h, 'deNghi'), `Phiên bản ${h.phienBan} · ${h.lines.length} dòng · Đơn vị lập`]);
  rows.push(['Sau thẩm tra', h.lines.some(l => l.thamTra !== null) ? hsTot(h, 'thamTra') : null, 'Cán bộ thẩm tra']);
  rows.push(['Được duyệt', appr ? hsTot(h, 'duyet') : null, 'Cấp có thẩm quyền' + (appr && h.quyetDinh ? ' · ' + esc(h.quyetDinh.so) : '')]);
  rows.push(['Đã phân bổ', appr ? sum(pbs.filter(p => p.chot), p => p.so) : null, 'Bộ phận phân bổ']);
  rows.push(['Đã giao', appr ? sum(pbs, p => p.daGiao) : null, 'Bộ phận giao' + (vbs.length ? ' · ' + vbs.length + ' văn bản' : '')]);
  const byDv = {};
  vbs.forEach(v => v.rows.forEach(r => { byDv[v.dv] = (byDv[v.dv] || 0) + r.so; }));
  const dvs = Object.entries(byDv).map(([dv, so]) => ({ten: nm('donVi', dv), so})).sort((a, b) => Math.abs(b.so) - Math.abs(a.so));
  return {money: moneyRows(rows), tl, dv: dvList(dvs.slice(0, 8), Math.max(0, dvs.length - 8))};
}

}

function vFlow() {

    <span class="rs">${ROLE_IO[r].buoc}${r === U.role ? ' · Bạn' : ''}</span><b>${esc(ROLES[r].ten)}</b><span class="rn">${esc(st.main)}</span><span class="rm">${esc(st.note)}</span></button>`; }).join('')}</div>`;

      ${hs.map(h => `<tr class="${h.id === U.p.fh ? 'selrow' : ''}"><td><b>${esc(h.ma)}</b><span class="sub">${esc(h.ten)}</span></td><td>${h.nam}</td><td>${stChip(h)}</td><td class="num">${fmt(amtOf(h))}</td><td class="small">${dtt(lastT(h))}</td>
