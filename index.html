  const j = journey(fh);
  const active = S.hoSo.filter(h => h.nam === U.nam && nodeOf(h) !== 'n10').length;
  const returned = S.hoSo.filter(h => h.nam === U.nam && NODE[nodeOf(h)].ret).length;
  const delivered = yearAgg(S, U.nam).khoan.length;
  return `<section class="flowhero panel" style="margin-bottom:16px"><div class="eyebrow">Sở Tài chính tỉnh Vĩnh Long</div><h2>Bản đồ luồng dữ liệu dự toán</h2><p>Quan sát xuyên suốt dữ liệu từ đơn vị lập dự toán đến quyết định, phân bổ, giao và theo dõi sau giao. Chọn một vai trò để xem dữ liệu nhận vào, xử lý và chuyển tiếp.</p>
    <div class="flowstats"><div class="flowstat"><b>7</b><span>vai trò phối hợp</span></div><div class="flowstat"><b>10</b><span>bước nghiệp vụ</span></div><div class="flowstat"><b>${active}</b><span>hồ sơ đang xử lý</span></div><div class="flowstat"><b>${delivered}</b><span>khoản đã giao</span></div></div>
  </section>
  <div class="flowguide" style="margin-bottom:16px"><i>✦</i><div><strong>Cách xem nhanh:</strong> chọn thẻ vai trò bên dưới để theo dõi luồng dữ liệu; các nhánh màu vàng là hồ sơ bị trả về để hoàn thiện. ${returned ? `Hiện có <b>${returned}</b> hồ sơ cần lưu ý.` : 'Hiện không có hồ sơ bị trả về trong năm đang xem.'}</div></div>
  <section class="panel" style="margin-bottom:16px"><div class="flowmap-head"><div><h3>Chuỗi xử lý liên thông</h3><p>Nhấp vào một vai trò để mở chi tiết trách nhiệm và dữ liệu liên quan.</p></div><div class="flow-key"><span><i style="--c:var(--brand-2)"></i>Vai trò đang chọn</span><span><i style="--c:var(--warn)"></i>Nhánh trả về</span></div></div><div class="pb">${chain}</div></section>
  <section class="panel" style="margin-bottom:16px"><header><h3>${esc(ROLES[sel].ten)} · ${io.buoc}</h3><p>${esc(ROLES[sel].nguoi)} – ${esc(ROLES[sel].cv)}</p></header>
    <div class="io">
      <div><h5>Nhận từ</h5>${ioCol(io.in, 'in')}</div>
      <div class="mid"><h5>Xử lý</h5><ul>${io.xl.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      <div><h5>Chuyển cho</h5>${ioCol(io.out, 'out')}${io.back.length ? `<h5 style="margin-top:14px">Trả về</h5>${ioCol(io.back.map(b => ({...b, ret: 1})), 'out')}` : ''}</div>
    </div></section>
  <section class="panel" style="margin-bottom:16px"><header><h3>${sel === 'admin' ? 'Kỳ lập dự toán' : sel === 'theodoi' ? `Hồ sơ đã giao năm ${U.nam}` : 'Hồ sơ đang ở vai trò này'}</h3></header>${list}</section>
  <section class="panel" style="margin-bottom:16px"><header><div class="journey-title"><span class="dot"></span><div><h3>Hành trình hồ sơ</h3><p>Theo dõi trạng thái, dòng tiền và văn bản của một hồ sơ cụ thể.</p></div></div>
    <div class="row"><label class="small muted" for="sel-fh">Hồ sơ:</label><select class="inp" style="width:auto" id="sel-fh" data-chg="fh">${all.map(x => `<option value="${x.id}" ${x.id === fh.id ? 'selected' : ''}>${esc(x.ma)} – ${esc(stOf(x).st || stOf(x).ten)}</option>`).join('')}</select><button class="btn sm" ${go('hs', {id: fh.id})}>Mở hồ sơ</button></div></header>
    <div class="pb jgrid">
      <div class="stack"><div><h5 class="lbl5">Dòng tiền (tỷ đồng)</h5>${j.money}</div><div><h5 class="lbl5">Giao cho đơn vị nhận</h5>${j.dv}</div></div>
      <div><h5 class="lbl5">Đường đi qua các vai trò</h5>${j.tl}</div>
    </div>
    <div class="pb" style="border-top:1px solid var(--line-2)"><h5 class="lbl5">Sơ đồ 7 làn xử lý</h5><div class="legend" style="margin-bottom:8px"><span style="--c:var(--brand-2)">Bước hiện tại</span><span style="--c:var(--warn)">Đang bị trả lại</span><span style="--c:var(--brand-soft)">Đã đi qua</span></div><div class="tw">${flowSvg(fh)}</div></div>
  </section>
  <details class="panel"><summary class="pb" style="cursor:pointer"><b>Mô tả 10 bước</b> <span class="small muted">– nguyên văn tài liệu thuyết minh, mục 6</span></summary>
    <div class="tw"><table class="t"><thead><tr><th>STT</th><th>Bước</th><th>Vai trò</th><th>Mô tả chi tiết</th></tr></thead><tbody>
    ${STEP_DESC.map(([t, r, d], i) => `<tr><td><b>${i + 1}</b></td><td style="min-width:150px"><b>${t}</b></td><td style="min-width:140px">${esc(ROLES[r].ten)}</td><td class="small" style="min-width:320px">${esc(d)}</td></tr>`).join('')}</tbody></table></div></details>`;
}

/* ================= THAO TÁC ================= */
const curHs = () => S.hoSo.find(x => x.id === U.p.id);
const now = () => new Date().toISOString();
function toast(msg, bad) {
  const box = document.getElementById('toasts'); const d = document.createElement('div');
  while (box.children.length >= 3) box.firstChild.remove();
  d.className = 'toast' + (bad ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = msg; box.appendChild(d);
  setTimeout(() => d.remove(), bad ? 5200 : 3200);
}
function goto(view, p) {
  U.view = view; U.p = p || {}; U.f = {};
  if (view === 'hs') { U.tab = 'ct'; const h = S.hoSo.find(x => x.id === U.p.id); if (h) U.nam = h.nam; }
  window.scrollTo(0, 0);
}
const need = (cond, msg) => { if (!cond) toast(msg, true); return cond; };
/* Điền sẵn hồ sơ dự toán năm bằng dữ liệu giả định (cố ý thiếu văn bản căn cứ nguồn để minh họa Bước 4 trả bổ sung) */
function fillHs(h) {
  h.lines = mkLinesDT(1); h.nguonDK = mkNguonDK(h.nam);
  h.canCuChung = `Luật Ngân sách nhà nước số 89/2025/QH15; hướng dẫn xây dựng dự toán ngân sách năm ${h.nam} của UBND tỉnh; định mức phân bổ chi thường xuyên theo Nghị quyết HĐND tỉnh.`;
  h.taiLieu = DM.bieuMau.slice(0, 3).map(b => ({id: uid('T'), bm: b.ma, ten: `${b.ten} năm ${h.nam}.pdf`, ngay: todayIso()}));
}

/* Cập nhật kết quả xử lý vào phiên bản đang được xem xét (bản lưu giữ cả số liệu thẩm tra/duyệt tại thời điểm đó) */
function markVer(h, st, ketQua) { const v = last(h.versions); if (!v) return; v.st = st; v.lines = clone(h.lines); if (ketQua) v.ketQua = ketQua; if (h.bcTT) v.bcTT = clone(h.bcTT); }
/* Trả hồ sơ: khóa phiên bản vừa xử lý kèm lý do, sinh phiên bản mới từ bản đó để đơn vị chỉnh sửa */
function newVer(h, role, buoc) {
  markVer(h, 'Bị trả lại', {...h.lastReturn});
  h.phienBan = last(h.versions).v + 1;
  h.lines.forEach(l => { l.thamTra = null; l.ykTT = ''; l.duyet = null; });
  h.checklist = {}; h.bcTT = null;
  addLog(role, h, buoc, `Lưu khóa phiên bản ${h.phienBan - 1}, sinh phiên bản ${h.phienBan} để chỉnh sửa`, 'Tài liệu và số liệu phiên bản cũ được giữ nguyên để đối chiếu');
}

const ACT = {
  go(d) { const p = {}; ['id', 'hs', 'dv', 'nam', 'fh', 'fdv'].forEach(k => { if (d[k]) p[k] = k === 'nam' ? +d[k] : d[k]; }); goto(d.view, p); },
  goAs(d) { U.role = d.role; ACT.go(d); toast('Đã đăng nhập bằng tài khoản ' + ROLES[d.role].nguoi + ' – ' + ROLES[d.role].ten); },
  tabGo(d) { goto('hs', {id: d.id}); U.tab = 'ls'; },
  menu() { U.menu = !U.menu; },
  flowRole(d) { U.p.fr = d.role; },
  flowHs(d) { U.p.fh = d.id; },
  tab(d) { U.tab = d.tab; U.p.cmp = undefined; },
  cmp(d) { U.p.cmp = +d.i; },
  dmTab(d) { U.p.dm = d.tab; },
  asRole(d) { U.role = d.role; U.f = {}; U.menu = false; toast('Đã đăng nhập bằng tài khoản ' + ROLES[d.role].nguoi + ' – ' + ROLES[d.role].ten); },
  toggleDemo() { U.demo = !U.demo; },
  reset() { U.menu = false; U.modal = {type: 'confirm'}; },
  doReset() { resetAll(); toast('Đã khôi phục dữ liệu minh họa ban đầu'); },
  closeModal(d, el, e) { if (d.self && e && e.target !== el) return false; U.modal = null; },
  khoan(d) { U.modal = {type: 'khoan', id: d.id}; },
  /* Ký số (mô phỏng): chọn chứng thư, nhập PIN rồi thực hiện thao tác kèm chữ ký */
  kyAsk(d) { U.modal = {type: 'ky', next: d.next, vb: d.vb}; },
  kyDo() { const m = U.modal; U.modal = null; U.sig = sigAt(U.role, now(), m.vb); try { ACT[m.next]({}); } finally { U.sig = null; } },
  excelAsk() { U.modal = {type: 'excel'}; },
  excelDo() { const h = curHs(); h.lines = mkLinesDT(1); U.modal = null; toast(`Đã nhập ${h.lines.length} nhiệm vụ chi từ tệp Du-toan-chi-${h.nam}.xlsx`); },
  ctSave() {
    const nam = U.nam, d = S.capTren[nam] || ctDefault(nam), v = k => F('ct_' + k, k in d ? d[k] : d.soKT[k]);
    if (!need((v('so') || '').trim(), 'Nhập số văn bản của cấp trên.')) return;
    S.capTren[nam] = {loai: v('loai'), so: v('so').trim(), ngay: v('ngay'), coQuan: v('coQuan'), soKT: Object.fromEntries(CT_NGUON.map(n => [n, v(n) || 0])), t: now(), nguoi: ROLES.lap.nguoi};
    addLog('lap', null, 2, 'Ghi nhận số giao từ cấp trên năm ' + nam, `${S.capTren[nam].so} · tổng ${fmt(sum(Object.values(S.capTren[nam].soKT)))} đ`); U.f = {}; toast('Đã ghi nhận số giao từ cấp trên năm ' + nam);
  },
  ctApply() {
    const h = curHs(), ct = S.capTren[h.nam], vb = `${ct.loai} số ${ct.so} ngày ${dt(ct.ngay)} của ${ct.coQuan}`;
    CT_NGUON.forEach(n => { const g = h.nguonDK.find(x => x.nguon === n); if (g) Object.assign(g, {so: ct.soKT[n], vb}); else h.nguonDK.push({id: uid('G'), nguon: n, so: ct.soKT[n], vb}); });
    toast(`Đã áp dụng số giao ${ct.so} vào nguồn dự kiến (${CT_NGUON.length} nguồn)`);
  },
  bmTab(d) { U.p.bm = d.tab; },
  bieuIn() { try { window.print(); } catch (e) { toast('Trình duyệt chặn lệnh in', true); } },
  bieuXls() { toast(`Đã xuất ${U.p.bm === 'b2' ? 'Biểu 02' : 'Biểu 01'} năm ${U.nam} ra tệp Excel (mô phỏng)`); },
  kyOpen(d) { const k = kyOf(+d.nam); k.st = 'Đang mở tiếp nhận'; k.moAt = now(); addLog('admin', null, 1, 'Mở kỳ lập dự toán năm ' + k.nam, `Tiếp nhận từ ${dt(k.tu)} đến ${dt(k.den)}`); toast(`Đã mở kỳ lập dự toán năm ${k.nam}. Đơn vị lập dự toán có thể lập hồ sơ.`); },
  kyClose(d) {
    const k = kyOf(+d.nam), h = dtOfYear(k.nam);
    if (!need(canCloseKy(k.nam), `Chưa thể đóng kỳ ${k.nam}: dự toán năm chưa được cấp có thẩm quyền phê duyệt để phân bổ cho các đơn vị${h ? ` (hồ sơ ${h.ma} đang ở Bước ${stOf(h).buoc}: ${stOf(h).ten})` : ' (chưa có hồ sơ dự toán)'}.`)) return;
    k.st = 'Đã đóng kỳ lập dự toán'; addLog('admin', null, 1, 'Đóng kỳ lập dự toán năm ' + k.nam, `Dự toán đã được phê duyệt: ${h.quyetDinh?.so || ''}`); toast('Đã đóng kỳ lập dự toán năm ' + k.nam);
  },

  /* Bước 2 – 3 */
  createDT() {
    const nam = U.nam, k = kyOf(nam);
    if (!need(k && k.st === 'Đang mở tiếp nhận', 'Kỳ lập dự toán chưa mở. Quản trị hệ thống cần mở kỳ ở Bước 1.')) return;
  const h = {id: uid('hs'), ma: `HS-${nam}-001`, nam, loai: 'DT', ten: `Dự toán ngân sách tỉnh Vĩnh Long năm ${nam}`, path: ['start', 'n1', 'n2'], phienBan: 1, lines: [], nguonDK: [],
      canCuChung: '', taiLieu: [], giaiTrinh: '', ykienTT: '', toTrinh: null, quyetDinh: null, checklist: {}, versions: [], lastReturn: null, duyetAt: null};
    fillHs(h); S.hoSo.push(h); addLog('lap', h, 2, 'Tạo hồ sơ dự toán (nháp)'); goto('hs', {id: h.id});
    toast(`Đã tạo hồ sơ nháp ${h.ma} và điền sẵn ${h.lines.length} nhiệm vụ chi giả định`);
  },

  createDC(d) {
    const nam = U.nam, n = S.hoSo.filter(h => h.nam === nam && h.loai === 'DC').length + 1;
    const h = {id: uid('hs'), ma: `HS-${nam}-DC${pad(n)}`, nam, loai: 'DC', ten: `Điều chỉnh, bổ sung dự toán năm ${nam} – đợt ${n}`, path: ['start', 'n1', 'n2'], phienBan: 1, lines: [], nguonDK: [],
      canCuChung: '', taiLieu: [], giaiTrinh: '', ykienTT: '', toTrinh: null, quyetDinh: null, checklist: {}, versions: [], lastReturn: null, duyetAt: null};
    const k = S.khoan.find(x => x.id === d.khoan) || S.khoan.find(x => x.nam === nam && x.nv === 'NV30') || S.khoan.find(x => x.nam === nam);
    if (k) h.lines.push({id: uid('L'), kieu: 'dc', khoanId: k.id, nguon: k.nguon, loai: k.loai, lv: k.lv, nv: k.nv, dv: k.dv, soTruoc: k.so, deNghi: 100 * TR, canCu: 'Phát sinh khối lượng công việc so với kế hoạch đầu năm', thamTra: null, ykTT: '', duyet: null});
    h.canCuChung = `Rà soát tình hình thực hiện dự toán năm ${nam}; phát sinh nhiệm vụ trong kỳ.`;
    h.taiLieu.push({id: uid('T'), bm: 'BM01', ten: `Tờ trình điều chỉnh dự toán đợt ${n}.pdf`, ngay: todayIso()});
    S.hoSo.push(h); U.modal = null; addLog('lap', h, 2, 'Tạo hồ sơ điều chỉnh/bổ sung'); goto('hs', {id: h.id}); toast('Đã tạo hồ sơ nháp ' + h.ma);
  },
  addLine() { curHs().lines.push({id: uid('L'), nguon: 'N1', loai: 'KTC', lv: '', nv: '', deNghi: 0, canCu: '', thamTra: null, ykTT: '', duyet: null}); },
  addDC() { curHs().lines.push({id: uid('L'), kieu: 'dc', khoanId: '', nguon: '', loai: '', lv: '', nv: '', dv: '', soTruoc: 0, deNghi: 0, canCu: '', thamTra: null, ykTT: '', duyet: null}); },
  addBS() { curHs().lines.push({id: uid('L'), kieu: 'bs', khoanId: null, nguon: 'N5', loai: 'KTC', lv: '', nv: '', dv: '', soTruoc: 0, deNghi: 0, canCu: '', thamTra: null, ykTT: '', duyet: null}); },
  delLine(d) { const h = curHs(); h.lines = h.lines.filter(l => l.id !== d.id); },
  addNguon() { curHs().nguonDK.push({id: uid('G'), nguon: '', so: 0, vb: ''}); },
  delNguon(d) { const h = curHs(); h.nguonDK = h.nguonDK.filter(g => g.id !== d.id); },
  addTL() {
    const h = curHs(), bm = F('tlbm', 'BM04'), ten = (F('tlten', '') || '').trim() || `${nm('bieuMau', bm)} năm ${h.nam}.pdf`;
    h.taiLieu.push({id: uid('T'), bm, ten, ngay: todayIso()}); delete U.f.tlten; toast('Đã đính kèm: ' + ten);
  },
  delTL(d) { const h = curHs(); h.taiLieu = h.taiLieu.filter(t => t.id !== d.id); },
  saveDraft() { toast('Đã lưu nháp hồ sơ ' + curHs().ma); },

    const h = curHs(), v = validateHs(h);
    if (!need(v.ok, 'Hồ sơ chưa đủ điều kiện gửi – xem khung “Kiểm tra trước khi gửi”.')) return;
    const resend = h.versions.length > 0; h.phienBan = h.phienBan || 1;
    h.versions.push({v: h.phienBan, t: now(), nguoi: ROLES.lap.nguoi, st: 'Đã gửi – chờ tiếp nhận', kySo: U.sig || null, nguonDK: clone(h.nguonDK), lines: clone(h.lines), taiLieu: clone(h.taiLieu), giaiTrinh: h.giaiTrinh || (['r2', 'r3'].includes(nodeOf(h)) ? defGT(h) : '')});
    h.lines.forEach(l => { l.thamTra = null; l.duyet = null; }); h.checklist = {}; h.giaiTrinh = '';
    h.path.push('n3', 'n4'); U.f = {};
    addLog('lap', h, 3, `${resend ? 'Gửi lại' : 'Gửi'} hồ sơ – phiên bản ${h.phienBan}`, h.versions[h.phienBan - 1].giaiTrinh ? 'Giải trình: ' + h.versions[h.phienBan - 1].giaiTrinh : '');

  },
  /* Bước 4 */
  tnOk() { const h = curHs(); markVer(h, 'Đã tiếp nhận – chuyển thẩm tra'); h.path.push('d1', 'n5'); addLog('tiepnhan', h, 4, 'Tiếp nhận, chuyển thẩm tra', `Phiên bản ${h.phienBan}`); U.f = {}; toast('Đã tiếp nhận và chuyển thẩm tra'); },
  tnRet() {
    const h = curHs(), miss = missingBM(h), note = (F('note', miss.length ? 'Đề nghị bổ sung: ' + miss.map(x => nm('bieuMau', x)).join(', ') + '.' : '') || '').trim();
    if (!need(note, 'Ghi rõ nội dung cần bổ sung trước khi trả lại.')) return;
    h.path.push('d1', 'r1'); h.lastReturn = {buoc: 4, role: 'tiepnhan', note, t: now()}; addLog('tiepnhan', h, 4, 'Trả lại bổ sung hồ sơ', note); newVer(h, 'tiepnhan', 4); U.f = {}; toast('Đã trả hồ sơ về đơn vị lập để bổ sung');
  },
  /* Bước 5 – 6 */
  ttFill() { curHs().lines.forEach(l => { if (l.thamTra === null) l.thamTra = l.deNghi; }); },
  ttOk() {
    const h = curHs();
    if (!need(h.lines.every(l => l.thamTra !== null), 'Nhập mức sau thẩm tra cho tất cả các dòng.')) return;
    h.ykienTT = h.ykienTT || DEF_YK;
    if (!need((h.ykienTT || '').trim(), 'Nhập ý kiến thẩm tra chung.')) return;
    if (h.loai === 'DT') { const v = canDoi(h, 'thamTra').filter(x => x.cl < 0); if (!need(!v.length, `Chưa cân đối được nguồn: ${v.map(x => x.ten).join(', ')}. Giảm mức sau thẩm tra hoặc yêu cầu đơn vị chỉnh sửa.`)) return; }
    markVer(h, 'Thẩm tra đạt'); h.path.push('d2', 'n6'); addLog('thamtra', h, 5, 'Thẩm tra đạt yêu cầu', `Tổng sau thẩm tra: ${fmt(hsTot(h, 'thamTra'))} đ`); U.f = {}; toast('Thẩm tra đạt. Tiếp theo: lập hồ sơ trình cấp có thẩm quyền.');
  },
  ttRet() {
    const h = curHs(), note = (F('note', '') || '').trim() || (document.getElementById('f-note')?.value || '').trim();
    if (!need(note, 'Ghi rõ nội dung yêu cầu giải trình/chỉnh sửa.')) return;
    h.path.push('d2', 'r2'); h.lastReturn = {buoc: 5, role: 'thamtra', note, t: now()}; addLog('thamtra', h, 5, 'Yêu cầu giải trình/chỉnh sửa', note); newVer(h, 'thamtra', 5); U.f = {}; toast('Đã trả hồ sơ về đơn vị lập để chỉnh sửa, giải trình');
  },
  trinh() {
    const h = curHs(), so = (F('ttso', (40 + S.hoSo.length) + '/TTr-BKTNS') || '').trim();
    if (!need(so, 'Nhập số tờ trình.')) return;
    h.toTrinh = {so, ngay: F('ttngay', todayIso()), kySo: U.sig || null}; h.bcTT = {so: so.replace('TTr', 'BC'), ngay: h.toTrinh.ngay, kySo: U.sig || null}; h.trinhAt = now(); markVer(h, 'Đã trình – chờ quyết định (khóa)'); h.path.push('n7');
    addLog('thamtra', h, 6, 'Trình cấp có thẩm quyền', `Tờ trình ${so}; khóa phiên bản ${h.phienBan}`); U.f = {}; toast(`Đã trình. Phiên bản ${h.phienBan} bị khóa trong thời gian xem xét.`);
  },
  /* Bước 7 */
  qdOk() {
    const h = curHs(), so = (F('qdso', (20 + S.hoSo.length) + '/NQ-HĐND') || '').trim();
    if (!need(so, 'Nhập số nghị quyết/quyết định.')) return;
    h.lines.forEach(l => { if (l.duyet === null) l.duyet = l.thamTra; });
    h.quyetDinh = {so, ngay: F('qdngay', todayIso()), kySo: U.sig || null}; h.duyetAt = now(); markVer(h, 'Được duyệt'); h.path.push('d3', 'n8');
    addLog('thamquyen', h, 7, 'Thông qua dự toán', `${so} · Tổng được duyệt ${fmt(hsTot(h, 'duyet'))} đ`); U.f = {}; toast('Đã thông qua. Kết quả là căn cứ để phân bổ và giao dự toán.');
  },
  qdRet() {
    const h = curHs(), note = (F('note', DEF_QD_RET) || '').trim();
    if (!need(note, 'Ghi rõ yêu cầu hoàn thiện.')) return;
    h.lines.forEach(l => { l.duyet = null; }); h.path.push('d3', 'r3'); h.lastReturn = {buoc: 7, role: 'thamquyen', note, t: now()};
    addLog('thamquyen', h, 7, 'Yêu cầu hoàn thiện hồ sơ', note); newVer(h, 'thamquyen', 7); U.f = {}; toast('Đã trả hồ sơ về đơn vị lập để hoàn thiện');
  },
  /* Bước 8 */
  pbAdd(d) {
    const h = S.hoSo.find(x => x.id === U.p.hs), l = h.lines.find(x => x.id === d.line);
    S.phanBo.push({id: uid('P'), nam: h.nam, hoSoId: h.id, lineId: l.id, dv: l.dv || nvOf(l.nv).dv || '', so: (l.duyet || 0) - pbSumLine(S, l), chot: false, daGiao: 0});
  },
  pbAuto() {
    const h = S.hoSo.find(x => x.id === U.p.hs); let n = 0;
    h.lines.forEach(l => { const rest = (l.duyet || 0) - pbSumLine(S, l); if (rest !== 0) { S.phanBo.push({id: uid('P'), nam: h.nam, hoSoId: h.id, lineId: l.id, dv: l.dv || nvOf(l.nv).dv, so: rest, chot: false, daGiao: 0}); n++; } });
    toast(n ? `Đã đề xuất ${n} dòng phân bổ theo đơn vị mặc định của nhiệm vụ` : 'Không còn số chưa phân bổ');
  },
  pbDel(d) { S.phanBo = S.phanBo.filter(p => p.id !== d.id); },
  pbChot() {
    const h = S.hoSo.find(x => x.id === U.p.hs), drafts = S.phanBo.filter(p => p.hoSoId === h.id && !p.chot);
    if (!need(drafts.every(p => p.dv && p.so), 'Mỗi dòng phân bổ cần có đơn vị nhận và số tiền khác 0.')) return;
    const bad = h.lines.filter(l => { const all = pbSumLine(S, l); return Math.abs(all) > Math.abs(l.duyet || 0) || all * (l.duyet || 0) < 0; });
    if (!need(!bad.length, `Số phân bổ vượt số được duyệt: ${bad.map(l => nm('nhiemVu', l.nv)).join(', ')}.`)) return;
    drafts.forEach(p => { p.chot = true; });
    if (nodeOf(h) === 'n8') h.path.push('n9');
    addLog('phanbo', h, 8, 'Chốt phương án phân bổ', `${drafts.length} dòng · ${fmt(sum(drafts, p => p.so))} đ`); toast(`Đã chốt ${drafts.length} dòng phân bổ. Tiếp theo: giao dự toán.`);
  },
  /* Bước 9 */
  gdv(d) { U.p.dv = d.dv; },
  giaoAll() {
    let n = 0;
    for (let i = 0; i < 40; i++) {
      const p = S.phanBo.find(x => x.hoSoId === U.p.hs && x.chot && x.so - x.daGiao !== 0);
      if (!p) break;
      U.p.dv = p.dv; U.f = {}; const before = S.vbGiao.length; ACT.giaoDo({quiet: 1});
      if (S.vbGiao.length === before) break; n++;
    }
    if (n) toast(`Đã ban hành ${n} quyết định giao dự toán cho ${n} đơn vị`);
  },
  giaoDo(d) {
    const h = S.hoSo.find(x => x.id === U.p.hs), dv = U.p.dv;
    const rows = S.phanBo.filter(p => p.hoSoId === h.id && p.dv === dv && p.chot && p.so - p.daGiao !== 0 && F('gi:' + p.id, true));
    if (!need(rows.length, 'Chọn ít nhất một khoản để giao.')) return;
    const amt = p => F('ga:' + p.id, p.so - p.daGiao);
    const bad = rows.filter(p => { const a = amt(p), r = p.so - p.daGiao; return !a || a * r < 0 || Math.abs(a) > Math.abs(r); });
    if (!need(!bad.length, 'Số giao phải khác 0 và không vượt số đã phân bổ còn lại.')) return;
    const so = (F('vbso', vbNo(h.nam)) || '').trim();
    if (!need(so, 'Nhập số văn bản giao.')) return;
    const hasTC = rows.some(p => h.lines.find(l => l.id === p.lineId).loai === 'TC');
    const vbtc = (F('vbtc', tcDefault(h, dv, F('vbngay', todayIso()))) || '').trim();
    if (hasTC && !need(vbtc, 'Có kinh phí giao tự chủ: nhập số, ngày QĐ giao quyền tự chủ, tự chịu trách nhiệm.')) return;
    const defVB = h.loai === 'DC' ? DM.vbGiao.KTC[1] : (hasTC ? DM.vbGiao.TC[0] : DM.vbGiao.KTC[0]);
    const ngay = F('vbngay', todayIso());
    applyGiao(S, {nam: h.nam, so, ngay, ngayGiao: F('vbgiao', ngay), dv, loaiVB: F('vbloai', defVB) || defVB, soQDTuChu: hasTC ? vbtc : '', hoSoId: h.id, kySo: U.sig || null, rows: rows.map(p => ({pbId: p.id, so: amt(p)}))}, now());
    S.vbSeq[h.nam] = (S.vbSeq[h.nam] || 1) + 1; U.f = {}; U.p.dv = null;
    if (!(d && d.quiet)) toast(`Đã ban hành ${so} và giao dự toán cho ${nm('donVi', dv)}. Khoản chuyển trạng thái “Đã giao”.`);
  },
};

const CHG = {
  role(v) { U.role = v; U.f = {}; },
  nam(v) { U.nam = +v; U.f = {}; if (['hs'].includes(U.view)) goto('hoso'); else U.p = {}; },
  pbhs(v) { U.p.hs = v; }, ghs(v) { U.p.hs = v; U.p.dv = null; }, fh(v) { U.p.fh = v; },
};

function bindSet(el) {
  const parts = el.dataset.bind.split(':'), t = parts[0];
  const raw = el.value;
  let v = el.type === 'checkbox' ? el.checked : el.dataset.money ? parseMoney(raw) : raw;
  const h = curHs();
  if (t === 'h') h[parts[1]] = v;
  else if (t === 'l') {
    const l = h.lines.find(x => x.id === parts[1]), k = parts[2];
    if (['thamTra', 'duyet'].includes(k) && !raw.trim()) v = null;
    l[k] = v;
    if (k === 'nv') { l.lv = nvOf(v).lv || ''; if (h.loai === 'DC' && l.kieu === 'bs') l.dv = nvOf(v).dv || l.dv; }
    if (k === 'khoanId') { const kk = S.khoan.find(x => x.id === v); if (kk) Object.assign(l, {nguon: kk.nguon, loai: kk.loai, lv: kk.lv, nv: kk.nv, dv: kk.dv, soTruoc: kk.so}); }
  }
  else if (t === 'g') { const g = h.nguonDK.find(x => x.id === parts[1]); g[parts[2]] = v; }
  else if (t === 'c') h.checklist[parts[1]] = v;
  else if (t === 'f') { U.f = U.f || {}; U.f[parts.slice(1).join(':')] = v; }
  else if (t === 'p') { const p = S.phanBo.find(x => x.id === parts[1]); p[parts[2]] = v; }
  else if (t === 'ky') kyOf(U.p.nam || 2027)[parts[1]] = v;
  else if (t === 'kyl') { const k = kyOf(U.p.nam || 2027), arr = k[parts[1]]; const i = arr.indexOf(parts[2]); if (v && i < 0) arr.push(parts[2]); if (!v && i >= 0) arr.splice(i, 1); }
}

function modalView() {
  if (!U.modal) return '';
  if (U.modal.type === 'confirm') return `<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mc-t"><header><h3 id="mc-t">Khôi phục dữ liệu mẫu?</h3></header><div class="mb"><p style="margin:0">Mọi thao tác đã làm trong prototype sẽ bị xóa và dữ liệu trở về trạng thái ban đầu của kịch bản demo.</p></div><footer><button class="btn" data-act="closeModal">Hủy</button><button class="btn danger" data-act="doReset">Khôi phục</button></footer></div></div>`;
  if (U.modal.type === 'ky') {
    const r = ROLES[U.role];
    return `<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mky-t"><header><h3 id="mky-t">Ký số văn bản</h3><button class="btn sm ghost" data-act="closeModal">Đóng</button></header><div class="mb">
      <div class="fld"><label>Văn bản ký</label><b>${esc(U.modal.vb)}</b></div>
      <div class="fld"><label for="ky-cert">Chứng thư số</label><select class="inp" id="ky-cert"><option>${esc(r.nguoi)} – ${esc(r.cv)} · Serial ${CERT[U.role]} · hiệu lực đến 31/12/2028</option></select></div>
      <div class="fld"><label for="ky-pin">Mã PIN thiết bị ký số</label><input class="inp" id="ky-pin" type="password" value="123456" autocomplete="off"></div>
      <p class="small muted" style="margin:0">Mô phỏng ký số bằng USB token/SIM ký số. Sau khi ký, văn bản ghi nhận người ký, thời gian ký và số serial chứng thư.</p></div>
      <footer><button class="btn" data-act="closeModal">Hủy</button><button class="btn pri" data-act="kyDo">Ký số và tiếp tục</button></footer></div></div>`;
  }
  if (U.modal.type === 'excel') {
    const h = curHs(), L = mkLinesDT(1);
    return `<div class="ov"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="mx-t"><header><h3 id="mx-t">Nhập dự toán chi từ Excel</h3><button class="btn sm ghost" data-act="closeModal">Đóng</button></header><div class="mb">
      <p class="small" style="margin:0">Tệp: <b>Du-toan-chi-${h.nam}.xlsx</b> · Sheet “Du toan chi” · <b>${L.length}</b> dòng hợp lệ, 0 dòng lỗi (mô phỏng tải lên).</p>
      <div class="tw"><table class="t"><thead><tr><th>Nhiệm vụ chi</th><th>Nguồn</th><th>Loại kinh phí</th><th class="num">Số đề nghị (đ)</th></tr></thead><tbody>
      ${L.slice(0, 6).map(l => `<tr><td>${esc(nm('nhiemVu', l.nv))}</td><td>${esc(nm('nguon', l.nguon))}</td><td>${esc(nm('loaiKP', l.loai))}</td><td class="num">${fmt(l.deNghi)}</td></tr>`).join('')}
      <tr><td colspan="4" class="muted small">… và ${L.length - 6} dòng khác</td></tr></tbody></table></div>
      ${h.lines.length ? `<div class="callout"><b>Lưu ý</b><p class="small">Dữ liệu nhập sẽ thay thế ${h.lines.length} dòng hiện có trong hồ sơ.</p></div>` : ''}</div>
      <footer><button class="btn" data-act="closeModal">Hủy</button><button class="btn pri" data-act="excelDo">Nhập vào hồ sơ</button></footer></div></div>`;
  }
  if (U.modal.type === 'khoan') { const k = S.khoan.find(x => x.id === U.modal.id); return k ? khoanModal(k) : ''; }
  return '';
}

let rq = 0, ptr = false, pend = false;
/* Không vẽ lại khi đang nhấn chuột – tránh nút bị thay thế giữa mousedown và mouseup làm mất cú bấm */
document.addEventListener('pointerdown', () => { ptr = true; }, true);
document.addEventListener('pointerup', () => { ptr = false; if (pend) setTimeout(() => { if (pend) render(); }, 0); }, true);
function render() {
  pend = false;
  const ae = document.activeElement, fid = ae && ae.id && ae !== document.body ? ae.id : null;
  document.getElementById('app').innerHTML = shell();
  document.getElementById('modal').innerHTML = modalView();
  if (fid) { const n = document.getElementById(fid); if (n) n.focus({preventScroll: true}); }
  save();
}
const later = () => { if (ptr) { pend = true; return; } cancelAnimationFrame(rq); rq = requestAnimationFrame(render); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (U.menu && !e.target.closest('.umenu')) { U.menu = false; if (!el) { render(); return; } }
  if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (fn(el.dataset, el, e) === false) return;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && U.modal) { U.modal = null; render(); }
  if (e.key === 'Escape' && U.menu) { U.menu = false; render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg) { CHG[el.dataset.chg](el.value); render(); return; }
  if (el.dataset.bind) { bindSet(el); later(); }
});

load();
render();

</script>
</body>
